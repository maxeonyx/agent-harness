[package]
name = "harness-limb-browser"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The browser limb: a real browser agents drive with scripts, over the DevTools protocol."

[dependencies]
harness-core = { path = "../core" }
harness-limb = { path = "../limb" }
harness-runtime = { path = "../runtime" }
harness-script = { path = "../script" }
harness-store = { path = "../store" }
harness-substrate = { path = "../substrate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[[bin]]
name = "harness-limb-browser"
path = "src/bin/browser.rs"
