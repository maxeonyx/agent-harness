[package]
name = "harness-brain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The brain: decides what every place says, works through its to-do list, and serves the face."

[dependencies]
harness-core = { path = "../core" }
harness-face-web = { path = "../face-web" }
harness-limb-workspace = { path = "../limb-workspace" }
harness-provider = { path = "../provider" }
harness-runtime = { path = "../runtime" }
harness-store = { path = "../store" }
harness-substrate = { path = "../substrate" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
