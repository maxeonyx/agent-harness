[package]
name = "harness-brain"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The brain: decides what every replica says, works through its to-do list, and serves the face."

[dependencies]
harness-core = { path = "../core" }
harness-face-web = { path = "../face-web" }
harness-program = { path = "../program" }
harness-provider = { path = "../provider" }
harness-runtime = { path = "../runtime" }
harness-store = { path = "../store" }
harness-substrate = { path = "../substrate" }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
harness-face-tab = { path = "../face-tab" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
