<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>harness</title>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --ground: #f0eee6; --paper: #faf9f5; --white: #fffefb; --line: #e3dfd3; --ink: #141413;
    --muted: #6b6a64; --faint: #a19f96; --maroon: #7a1f22; --maroon-soft: #f3e3e1; --hover: #e9e5d9;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; gap: .35em; padding: .3em .75em; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { color: var(--faint); cursor: default; background: var(--paper); }
  .btn.armed { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: #33322e; }
  .btn.primary.armed { background: var(--maroon); border-color: var(--maroon); }
  [hidden] { display: none !important; }

  /* The header and the footer float over the map. */
  #top, #bottom {
    position: fixed; left: 0; right: 0; z-index: 30; display: flex; align-items: center; gap: .9em;
    padding: .55em 1.1em; pointer-events: none;
  }
  #top > *, #bottom > * { pointer-events: auto; }
  #top { top: 0; padding-top: max(.55em, env(safe-area-inset-top)); }
  #bottom { bottom: 0; color: var(--muted); font-size: 12.5px; padding-bottom: max(.55em, env(safe-area-inset-bottom)); }
  .mark { font: 600 17px var(--serif); letter-spacing: .01em; }
  .spacer { flex: 1; pointer-events: none !important; }
  #link { width: .55em; height: .55em; border-radius: 50%; background: #6c8f5e; }
  #link.down { background: var(--maroon); animation: breathe 1.2s infinite; }
  #pill { border-color: transparent; background: rgba(250, 249, 245, .85); backdrop-filter: blur(6px); }
  #pill.owed { background: var(--maroon); color: var(--paper); border-color: var(--maroon); }
  #pill.owed .n { font-weight: 700; }
  #usage { display: inline-flex; gap: 1.1em; align-items: center; }
  .gauge { display: inline-flex; gap: .4em; align-items: center; }
  .gauge i { display: inline-block; width: 3.4em; height: .32em; border-radius: 1em; background: var(--line); overflow: hidden; }
  .gauge i b { display: block; height: 100%; background: var(--muted); }
  .gauge.high i b { background: var(--maroon); }
  .alarm { color: var(--maroon); font-weight: 600; }
  #bottom .btn { font-size: 13px; background: rgba(250, 249, 245, .85); backdrop-filter: blur(6px); }

  /* The map: an endless dotted ground, the world on it. */
  #map { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background-color: var(--ground);
    background-image: radial-gradient(circle, rgba(20, 20, 19, .10) 1px, transparent 1.3px); }
  #map.grabbing { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world.flying { transition: transform .45s var(--ease); }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #map.dim #world { opacity: .4; filter: saturate(.5); transition: opacity .3s, filter .3s; }
  #world { transition: opacity .3s, filter .3s; }
  #empty { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: .8em; color: var(--muted); }
  #empty h2 { font: 500 22px var(--serif); color: var(--ink); margin: 0; }

  path.edge { fill: none; stroke: rgba(20, 20, 19, .32); stroke-width: 1.5; }
  path.edge.receives { stroke-dasharray: 5 5; }
  path.edge.continues { stroke-dasharray: 1.5 4.5; stroke-linecap: round; stroke: rgba(20, 20, 19, .28); }
  path.edge.flow { stroke: rgba(20, 20, 19, .62); stroke-dasharray: 2 7; stroke-linecap: round; stroke-width: 2; animation: flow .9s linear infinite; }
  path.edge.flow.max { stroke: var(--maroon); }
  @keyframes flow { to { stroke-dashoffset: 18; } }

  /* A node: a dot and its name, no box. */
  .node {
    position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: inherit; text-align: center; transform-origin: 50% 0;
  }
  .node .dot {
    position: relative; width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center;
    background: var(--paper); border: 1.5px solid var(--ink); font: 600 calc(var(--d) * .44) / 1 var(--serif);
    transition: transform .2s var(--ease), background .3s, border-color .3s, color .3s;
  }
  .node:hover .dot { transform: scale(1.1); }
  .node .name { margin-top: 5px; font: 600 13.5px/1.2 var(--serif); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.root .name { font-size: 15.5px; }
  .node .status { margin-top: 1px; font-size: 11.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .where { font-size: 11px; color: var(--faint); }
  .node .ring { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; pointer-events: none; }
  .node.working .ring { border-top-color: var(--ink); border-right-color: rgba(20, 20, 19, .25); animation: spin 1.5s linear infinite; }
  .node.streaming .ring { animation-duration: .7s; }
  .node.tool .ring { border: 2px dashed rgba(20, 20, 19, .55); animation: spin 4s linear infinite; }
  .node.waiting-children .ring { border-color: rgba(20, 20, 19, .18); }
  .node.starting .dot { border-style: dashed; color: var(--faint); }
  .node.starting .ring { border: 2px dotted rgba(20, 20, 19, .3); animation: spin 6s linear infinite; }
  .node.open .dot { border-color: var(--maroon); color: var(--maroon); background: var(--white); border-width: 2px; }
  .node.open .ring { border-color: var(--maroon); opacity: .5; animation: halo 2.4s var(--ease) infinite; }
  .node.open .status { color: var(--maroon); font-weight: 600; }
  .node.listening .dot { border-style: double; border-width: 3px; }
  .node.held .dot, .node.limited .dot { border-color: var(--faint); color: var(--faint); }
  .node.done .dot { background: #8d8b83; border-color: #8d8b83; color: var(--paper); }
  .node.done .name { color: var(--muted); font-weight: 500; }
  .node.failed .dot { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .node.failed .status, .node .status.trouble { color: var(--maroon); }
  .node.cancelled .dot { background: var(--line); border-color: var(--faint); color: var(--muted); border-radius: 30%; }
  .node .badge {
    position: absolute; top: -7px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--maroon); color: var(--paper); font: 700 10.5px/17px var(--sans);
  }
  .node .more { margin-top: 3px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 0 .5em; background: var(--paper); }
  /* A finished project, folded: a small card on the archive shelf. */
  .node.archived { align-items: flex-start; text-align: left; justify-content: center; height: 40px; padding: 0 1.6em 0 .7em; border: 1px solid var(--line); border-radius: 10px; background: rgba(250, 249, 245, .7); }
  .node.archived:hover { background: var(--paper); }
  .node.archived .dot { display: none; }
  .node.archived .name { margin: 0; font: 500 13px/1.2 var(--serif); color: var(--muted); }
  .node.archived .status { font-size: 11px; color: var(--faint); }
  .node.archived .more { position: absolute; right: .3em; top: 50%; transform: translateY(-50%); margin: 0; border: 0; background: none; }
  .node.archived.selected { border-color: var(--ink); }
  .node.selected .dot { box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ink); }
  .node.scope { pointer-events: none; }
  .node.scope .dot { --d: 9px; background: var(--ink); border: 0; }
  .node.scope.background .dot { background: var(--paper); border: 1.5px solid var(--ink); }
  .node.scope.settled .dot { background: #8d8b83; }
  .node.sat .dot { font: 600 11px/1 var(--sans); border-style: dashed; }
  .node.sat .name { font: 12px/1.2 var(--sans); color: var(--muted); font-weight: 400; }
  .node.sat.ask .dot { border-color: var(--maroon); color: var(--maroon); border-style: solid; }
  .node.sat.ask .name { color: var(--maroon); font-weight: 600; }
  .node.enter { animation: grow .45s var(--ease); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes halo { 0% { transform: scale(1); opacity: .55; } 70% { transform: scale(1.45); opacity: 0; } 100% { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes grow { from { transform: scale(.2); opacity: 0; } }

  /* The queue: what waits on Max, in his order. */
  #drawer {
    position: fixed; top: 3.2em; right: 1em; z-index: 40; width: min(26em, calc(100vw - 2em)); max-height: 70vh; overflow: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 50px rgba(40, 30, 20, .18);
    padding: .4em;
  }
  #drawer h3 { margin: .4em .7em .3em; font: 600 11.5px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); display: flex; align-items: center; }
  #drawer h3 .btn { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .queued { display: grid; grid-template-columns: 1.6em 1fr auto; gap: .1em .5em; padding: .55em .6em; border-radius: 10px; cursor: pointer; }
  .queued:hover { background: var(--hover); }
  .queued .num { color: var(--maroon); font-weight: 700; text-align: right; }
  .queued .what { font: 600 14px var(--serif); }
  .queued .ask, .queued .why { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
  .queued .ask { color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .queued .move { display: flex; gap: .2em; }
  .queued .move button { padding: 0 .35em; border-radius: 5px; color: var(--muted); }
  .queued .move button:hover { background: var(--line); color: var(--ink); }
  .queued .move button:disabled { visibility: hidden; }
  .nothing { padding: .6em .8em; color: var(--muted); }

  /* A node opened: its log, over the map, which still shows around it. */
  #panel {
    position: fixed; z-index: 20; top: 3.4em; bottom: 2.9em; left: 50%; width: min(70rem, calc(100vw - 7rem)); transform: translateX(-50%);
    display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 24px 70px rgba(40, 30, 20, .22); overflow: hidden;
  }
  #panel > .bar { display: flex; align-items: center; gap: .6em; padding: .6em .8em .6em 1.1em; border-bottom: 1px solid var(--line); min-height: 3.1em; flex-wrap: wrap; }
  .crumbs { display: flex; align-items: baseline; gap: .3em; min-width: 0; flex: 1 1 auto; overflow: hidden; white-space: nowrap; }
  .crumbs a { color: var(--muted); text-decoration: none; font-size: 13px; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .crumbs .sep { color: var(--faint); }
  .crumbs .here { font: 600 17px var(--serif); overflow: hidden; text-overflow: ellipsis; }
  .crumbs .role { font-size: 12px; color: var(--muted); margin-left: .3em; }
  .bar .state { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .bar .state.max { color: var(--maroon); font-weight: 600; }
  .bar .ctx { display: inline-flex; align-items: center; gap: .4em; font-size: 12px; color: var(--muted); white-space: nowrap; border-radius: 8px; padding: .15em .4em; }
  .bar .ctx:hover { background: var(--hover); }
  #panel > .mix { border-bottom: 1px solid var(--line); padding: .7em 1.1em .8em; font-size: 12.5px; color: var(--muted); }
  .mix .stack { display: flex; height: .55em; border-radius: 1em; overflow: hidden; background: var(--line); margin: .45em 0 .6em; max-width: 40em; }
  .mix .stack b { display: block; height: 100%; }
  .mix table { border-collapse: collapse; }
  .mix td { padding: .05em 1.2em .05em 0; }
  .mix td.n { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mix i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: .45em; vertical-align: -.05em; }
  .node .fill { display: block; width: 3.2em; height: 3px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
  .node .fill b { display: block; height: 100%; background: var(--muted); }
  .node .fill.high b { background: var(--maroon); }
  .bar .controls { display: flex; gap: .35em; align-items: center; }
  .bar .controls .btn, .bar > .btn { font-size: 12.5px; padding: .2em .65em; }
  .bar .answer { font-size: 12.5px; color: var(--muted); }
  .bar .answer.bad { color: var(--maroon); font-weight: 600; }
  .bar .x { font-size: 20px; line-height: 1; padding: .1em .35em; border-radius: 8px; color: var(--muted); }
  .bar .x:hover { background: var(--hover); color: var(--ink); }
  #panel .back { display: none; }
  #panel > .body { flex: 1; display: flex; min-height: 0; }
  .scroll { flex: 1; overflow: auto; overscroll-behavior: contain; scroll-padding-bottom: 2em; }
  .log { max-width: 48rem; margin: 0 auto; padding: 1.4em 1.6em 2.5em; }
  .viewer { flex: 1; min-width: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--white); }
  .viewer header { display: flex; align-items: center; gap: .6em; padding: .5em .8em; border-bottom: 1px solid var(--line); font-size: 13px; }
  .viewer header .path { font-family: var(--mono); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer .content { flex: 1; overflow: auto; padding: 1em 1.4em; }
  .viewer iframe { width: 100%; height: 100%; border: 0; background: white; }
  .viewer .content.frame { padding: 0; }
  .jump { position: sticky; bottom: .8em; margin: 0 auto; display: block; width: max-content; box-shadow: 0 6px 18px rgba(40, 30, 20, .15); }

  /* The log reads like Claude Desktop's chat, and is the exact context. */
  .entry { margin: 0 0 1.1em; }
  .prose { font: 16px/1.62 var(--serif); overflow-wrap: anywhere; }
  .prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose pre, .prose blockquote, .prose table { margin: .65em 0; }
  .prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--serif); line-height: 1.25; margin: 1.1em 0 .45em; }
  .prose h1 { font-size: 1.35em; } .prose h2 { font-size: 1.2em; } .prose h3 { font-size: 1.07em; }
  .prose code { font: .86em var(--mono); background: rgba(20, 20, 19, .055); padding: .1em .3em; border-radius: 4px; }
  .prose pre { background: #f3f1ea; border: 1px solid var(--line); border-radius: 8px; padding: .7em .9em; overflow: auto; }
  .prose pre code { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  .prose blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 1em; color: var(--muted); }
  .prose table { border-collapse: collapse; font-size: .92em; display: block; overflow: auto; }
  .prose th, .prose td { border: 1px solid var(--line); padding: .3em .6em; text-align: left; }
  .prose a { color: var(--maroon); }
  .prose img { max-width: 100%; }
  .plain { white-space: pre-wrap; }
  .said { display: flex; flex-direction: column; align-items: flex-end; }
  .said .caption { font-size: 11.5px; color: var(--muted); margin: 0 .5em .2em; }
  .said .bubble { max-width: 85%; background: #e9e5da; border-radius: 16px 16px 4px 16px; padding: .6em 1em; font: 15px/1.55 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
  .said.queued-words .bubble { background: transparent; border: 1.5px dashed var(--faint); }
  .said.answer .bubble { border-left: 3px solid var(--maroon); }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--white); padding: .75em 1em; }
  .card .label { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: .35em; display: flex; gap: .6em; align-items: baseline; }
  .card.mandate { background: transparent; }
  .card.mandate .prose { font-size: 15px; }
  .card.clip .prose { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .more-link { font-size: 12.5px; color: var(--maroon); margin-top: .3em; cursor: pointer; }
  details > summary.more-link { margin: .1em 0 .3em 1em; }
  .card.ask { border-color: var(--maroon); background: var(--maroon-soft); }
  .card.ask .label { color: var(--maroon); }
  .card.result { border-color: #c9c4b4; }
  .card.ended { border-color: var(--maroon); color: var(--maroon); }
  .note { display: flex; gap: .5em; font-size: 12.5px; color: var(--muted); margin: .2em 0 1em; }
  .note::before { content: "⚙"; color: var(--faint); }
  .note .t { white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; cursor: pointer; }
  .note .t.full { display: block; }
  .meta { font-size: 11.5px; color: var(--faint); margin: -.5em 0 1.1em; }
  .thought { font-size: 13px; color: var(--muted); margin: 0 0 .7em; }
  .thought summary { cursor: pointer; list-style: none; }
  .thought summary::before { content: "◌ "; }
  .thought .plain { font-style: italic; margin: .3em 0 0 1.1em; }
  .steps { margin: 0 0 1.1em; border-left: 2px solid var(--line); padding-left: .2em; }
  .steps > .head { font-size: 12.5px; color: var(--muted); padding: .1em .5em .3em; cursor: pointer; }
  .steps > .head:hover { color: var(--ink); }
  .steps.folded > .row:not(:last-child) { display: none; }
  .row { margin: 0 0 .15em; }
  .row > .line { display: flex; align-items: baseline; gap: .55em; padding: .22em .5em; border-radius: 7px; cursor: pointer; font-size: 13.5px; min-width: 0; }
  .row > .line:hover { background: var(--hover); }
  .row .tool { font: 600 12px var(--mono); color: var(--ink); }
  .row .gist { font: 12.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .row .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .row .st.bad { color: var(--maroon); }
  .row .st.run::before { content: ""; display: inline-block; width: .7em; height: .7em; border: 1.5px solid var(--ink); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -.05em; margin-right: .3em; }
  .row .open-file { font-size: 12px; color: var(--maroon); }
  .row > .meta { margin: 0 0 .3em .5em; }
  .row > .detail { margin: .2em 0 .6em 1em; }
  .row:not(.expanded) > .detail { display: none; }
  .io { font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f1ea; border: 1px solid var(--line); border-radius: 8px; padding: .55em .75em; margin: .3em 0; max-height: 28em; overflow: auto; }
  .io.err { border-color: var(--maroon); }
  .io .k { color: var(--muted); }
  .rendered { border: 1px solid var(--line); border-radius: 8px; padding: .7em 1em; background: var(--white); margin: .3em 0; max-height: 34em; overflow: auto; }
  .rendered img { max-width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: .4em; margin: .25em 0 .5em 1em; }
  .chip { display: inline-flex; align-items: center; gap: .4em; padding: .25em .7em .25em .35em; border: 1px solid var(--line); border-radius: 999px; background: var(--white); font: 600 13px var(--serif); text-decoration: none; color: inherit; }
  .chip:hover { border-color: var(--ink); }
  .chip .d { width: 1.15em; height: 1.15em; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font: 600 9px var(--serif); }
  .chip.done .d { background: #8d8b83; border-color: #8d8b83; color: var(--paper); }
  .chip.open .d { border-color: var(--maroon); color: var(--maroon); }
  .chip.failed .d { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .chip .s { font: 11.5px var(--sans); color: var(--muted); }
  .live-text { border-left: 2px solid var(--ink); padding-left: .9em; }
  .live-text::after { content: "▍"; animation: breathe 1s infinite; }
  .exact .io { max-height: none; }
  .exact-entry { margin: 0 0 1em; }
  .exact-entry .who { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .exact-entry.assistant .who { color: var(--maroon); }

  /* What Max writes: a staging area, kept until he sends it one of two ways. */
  .compose { padding: .2em 1.2em 1em; }
  .compose .box { max-width: 48rem; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 2px 10px rgba(40, 30, 20, .06); padding: .55em .7em .5em .9em; }
  .compose .box:focus-within { border-color: #c9c4b4; box-shadow: 0 2px 14px rgba(40, 30, 20, .1); }
  .compose .box.drop { border-color: var(--ink); }
  .compose .others:empty { display: none; }
  .compose .other { display: flex; align-items: center; gap: .6em; max-width: 48rem; margin: 0 auto .35em; padding: .35em .6em; border: 1px dashed var(--line, #8884); border-radius: 8px; font-size: 13px; }
  .compose .other .said { flex: 1; white-space: pre-wrap; }
  .compose .other .why { color: var(--muted); font-size: 12px; }

  .compose .tray:empty { display: none; }
  .compose .att { display: inline-flex; align-items: center; gap: .35em; font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: .15em .25em .15em .4em; background: var(--paper); max-width: 16em; }
  .compose .att img { height: 2.2em; border-radius: 4px; }
  .compose .att span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compose .att button { color: var(--muted); padding: 0 .3em; }
  .compose .to { font-size: 11.5px; color: var(--muted); margin-bottom: .15em; }
  .compose .to.answering { color: var(--maroon); font-weight: 600; }
  .compose textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; font: 15px/1.5 var(--sans); color: var(--ink); min-height: 2.6em; max-height: 40vh; padding: 0; }
  .compose .row2 { display: flex; align-items: center; gap: .5em; margin-top: .3em; }
  .compose .status { flex: 1; font-size: 12px; color: var(--muted); }
  .compose .status.bad { color: var(--maroon); font-weight: 600; }
  .compose .mic.on { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .compose .closed { max-width: 48rem; margin: 0 auto; color: var(--muted); font-size: 13px; text-align: center; padding: .4em; }

  /* A new task: Max's own scope. */
  #sheet {
    position: fixed; z-index: 40; left: 1em; bottom: 3.4em; width: min(30em, calc(100vw - 2em));
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 50px rgba(40, 30, 20, .2); padding: 1em 1.1em;
  }
  #sheet h3 { margin: 0 0 .6em; font: 600 16px var(--serif); }
  #sheet label { display: block; font-size: 12px; color: var(--muted); margin: .45em 0 .15em; }
  #sheet input, #sheet select, #sheet textarea { width: 100%; font: 14px var(--sans); padding: .4em .55em; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); }
  #sheet textarea { min-height: 7em; resize: vertical; }
  #sheet .check { display: flex; gap: .5em; align-items: center; color: var(--ink); font-size: 13.5px; margin-top: .6em; }
  #sheet .check input { width: auto; }
  #sheet .acts { display: flex; gap: .5em; align-items: center; margin-top: .8em; }
  #sheet .acts .answer { flex: 1; font-size: 12.5px; color: var(--muted); }
  #sheet .acts .answer.bad { color: var(--maroon); font-weight: 600; }

  @media (max-width: 760px) {
    #panel { inset: 0; width: auto; transform: none; border-radius: 0; border: 0; border-top: 1px solid var(--line); top: calc(2.75em + env(safe-area-inset-top)); bottom: 0; z-index: 31; box-shadow: none; }
    #top { background: var(--ground); }

    #panel .back { display: inline-block; font-size: 22px; padding: 0 .4em; }
    .bar .x { display: none; }
    .crumbs a, .crumbs .sep, .crumbs .role { display: none; }
    .bar .ctx { display: none; }
    .bar .controls { order: 9; width: 100%; overflow-x: auto; }
    .log { padding: 1em 1em 2em; }
    .prose { font-size: 15.5px; }
    .compose { padding: .2em .5em max(.5em, env(safe-area-inset-bottom)); }
    .viewer { position: absolute; inset: 0; z-index: 2; border: 0; }

    #usage .reset { display: none; }
    #bottom { gap: .6em; padding-left: .7em; padding-right: .7em; }
    #build { display: none; }
  }
</style>
</head>

  <h3>A new task in your scope</h3>

<script>
"use strict";
// ─── Small things ──────────────────────────────────────────────────────────
const $ = (s, root = document) => root.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const svgEl = (tag) => document.createElementNS("http://www.w3.org/2000/svg", tag);
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m` : `${Math.floor(s / 86400)}d`;
};
const kTokens = (n) => n == null ? "?" : n < 1000 ? `${n}` : n < 1e6 ? `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k` : `${+(n / 1e6).toFixed(1)}M`;
const parse = (s) => { try { return JSON.parse(s); } catch { return undefined; } };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const phone = () => matchMedia("(max-width: 760px)").matches;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

// The gist of a call's input: its command, or the path or pattern it names.
function gist(input) {
  const v = typeof input === "string" ? parse(input) : input;
  const s = v && (v.command ?? v.path ?? v.pattern ?? v.question ?? v.name ?? v.tool);
  if (typeof s !== "string") return "";
  const line = s.split("\n")[0];
  return line.length > 90 ? line.slice(0, 90) + "…" : line;
}

function markdown(text) {
  if (!window.marked || !window.DOMPurify) return el("div", "plain", text);
  const div = el("div", "prose");
  div.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
  for (const a of div.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
  return div;
}

// ─── This tab: a place on the substrate ────────────────────────────────────
// The tab is the wasm build of harness-face-tab: its own records, kept in
// IndexedDB until the brain's standing covers them, and its replica of the
// rows the brain derives for it. This script is glue: the DOM, the link and
// IndexedDB. Whatever the tab says is parsed into core's facts by the wasm,
// stored, and only then shipped; what became of it is read off the tab's
// standing in a later view, so a refusal shows here, where it was made.
let can = { act: false, dictation: false, sample: false };
fetch("/wiring").then((r) => r.json()).then((c) => { can = c; render(); });

const enc = new TextEncoder(), dec = new TextDecoder();
let wasm = null;
// One call into the tab: `input` (a string or bytes) in its I/O buffer,
// the export's JSON output back.
function tabCall(name, input, ...args) {
  if (input !== undefined) {
    const bytes = typeof input === "string" ? enc.encode(input) : input;
    const at = wasm.io(bytes.length);
    new Uint8Array(wasm.memory.buffer, at, bytes.length).set(bytes);
  }
  const ret = wasm[name](...args);
  const out = new Uint8Array(wasm.memory.buffer, wasm.io_ptr(), wasm.io_len());
  return { ret, out: out.length ? JSON.parse(dec.decode(out)) : null };
}
// What names a value in the facts: its digest, as the core computes it.
const digest = (text) => tabCall("digest", text).out;

// IndexedDB: every place's records this browser holds, by time.
const db = new Promise((ok, fail) => {
  const open = indexedDB.open("harness-tabs", 1);
  open.onupgradeneeded = () => open.result.createObjectStore("records", { keyPath: "at" }).createIndex("place", "place");
  open.onsuccess = () => ok(open.result);
  open.onerror = () => fail(open.error);
});
const done = (tx) => new Promise((ok, fail) => { tx.oncomplete = ok; tx.onerror = tx.onabort = () => fail(tx.error); });
async function loadPlace(place) {
  const store = (await db).transaction("records").objectStore("records");
  const req = store.index("place").getAll(place);
  return new Promise((ok, fail) => { req.onsuccess = () => ok(req.result.map((r) => r.record)); req.onerror = () => fail(req.error); });
}
async function placesHeld() {
  const req = (await db).transaction("records").objectStore("records").index("place").getAllKeys();
  const keys = await new Promise((ok, fail) => { req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error); });
  return [...new Set(keys.map((at) => at.split(".")[0]))];
}
async function forget(place) {
  const tx = (await db).transaction("records", "readwrite");
  const store = tx.objectStore("records");
  for (const at of await new Promise((ok) => { const r = store.index("place").getAllKeys(place); r.onsuccess = () => ok(r.result); })) store.delete(at);
  await done(tx);
}

// A place: a tab's handle in the wasm and its link to the brain.
class Place {
  constructor(id, handle, onView) { this.id = id; this.h = handle; this.onView = onView; this.ws = null; this.waiting = []; this.flushing = Promise.resolve(); }
  static async open(id, onView) {
    const { ret, out } = tabCall("open", JSON.stringify({ place: id, records: await loadPlace(id) }));
    if (ret === 0xffffffff) throw new Error(out.error);
    return new Place(id, ret, onView);
  }
  // Make the tab's writes durable, in order.
  persist() {
    const writes = tabCall("writes", undefined, this.h).out;
    if (!writes.length) return this.flushing;
    this.flushing = this.flushing.then(async () => {
      const tx = (await db).transaction("records", "readwrite");
      const store = tx.objectStore("records");
      for (const w of writes) {
        if (w.Put) store.put({ at: w.Put.at, place: this.id, record: w.Put });
        else store.delete(w.Drop);
      }
      await done(tx);
    });
    return this.flushing;
  }
  connect() {
    const ws = this.ws = new WebSocket(`wss://${location.host}/link?place=${this.id}`);
    ws.onopen = () => this.shipUnsent();
    ws.onmessage = (m) => {
      const { out } = tabCall("down", m.data, this.h);
      if (out.error) return console.error(out.error);
      if (out.live) return liveArrived(out.live.live);
      const fresh = m.data.startsWith('{"View"');
      this.persist();
      this.waiting = this.waiting.filter((w) => {
        const s = this.status(w.n);
        if (s === "pending") return true;
        w.ok(s === "included" ? null : s.refused);
        return false;
      });
      this.onView?.(fresh);
    };
    ws.onclose = () => { if (this.ws === ws) { this.onView?.(null); setTimeout(() => this.connect(), 1000); } };
  }
  close() { const ws = this.ws; this.ws = null; ws?.close(); tabCall("close", undefined, this.h); }
  shipUnsent() {
    const { out } = tabCall("unsent", undefined, this.h);
    if (out.restored) return restored(this);
    for (const up of out.ups) this.ws?.send(JSON.stringify(up));
  }
  status(n) { return tabCall("status", undefined, this.h, n).out; }
  view() { return tabCall("view", undefined, this.h).out; }
  next() { return tabCall("next", undefined, this.h).out; }
  records() { return tabCall("records", undefined, this.h).out; }
  settled() { return wasm.settled(this.h) === 1; }
  // Say a batch: stored, then shipped. Resolves with null once the brain
  // includes it, or with why it refused it; until then it is pending.
  async say(batch) {
    const { out } = tabCall("say", JSON.stringify(batch), this.h, Date.now());
    if (out.error) return out.error;
    await this.persist();
    if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(out.up));
    return new Promise((ok) => this.waiting.push({ n: out.n, ok }));
  }
}

// This tab's place: kept in sessionStorage across reloads, and held by a
// Web Lock, so a duplicated tab (which copies sessionStorage) becomes a
// place of its own. A place is per tab per brain: IndexedDB is per origin.
const mintPlace = () => [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join("");
function hold(id) {
  return new Promise((ok) => navigator.locks.request(`place:${id}`, { ifAvailable: true }, (lock) => {
    ok(!!lock);
    return lock ? new Promise(() => {}) : null;
  }));
}
let tab = null;
async function start() {
  wasm = (await WebAssembly.instantiateStreaming(fetch("/tab.wasm"))).instance.exports;
  let id = sessionStorage.getItem("place");
  if (!id || !(await hold(id))) { do id = mintPlace(); while (!(await hold(id))); }
  sessionStorage.setItem("place", id);
  tab = await Place.open(id, viewArrived);
  restoreLocal();
  tab.connect();
  adoptOrphans();
}
// A closed tab's place, whose lock is free: ship what it had not, then
// forget it, so nothing typed in a tab that was closed offline is lost.
async function adoptOrphans() {
  for (const id of await placesHeld()) {
    if (id === tab.id || !(await hold(id))) continue;
    const orphan = await Place.open(id, () => {
      if (!orphan.settled()) return;
      orphan.close();
      forget(id);
    });
    orphan.connect();
  }
}
// The brain holds more of this place than this browser does: its storage
// was restored or lost. It goes on as a new place.
async function restored(place) {
  if (place !== tab) { place.close(); return forget(place.id); }
  tab.close();
  await forget(tab.id);
  let id; do id = mintPlace(); while (!(await hold(id)));
  sessionStorage.setItem("place", id);
  tab = await Place.open(id, viewArrived);
  tab.connect();
}

// Max's facts, in one record at this tab. `facts` may be a function of the
// record's time, `place.n`, which names what the record creates
// (`${at}.0`). Values are the texts the facts name. Resolves with null once
// included, or the brain's reason for refusing it.
async function act(facts, values = []) {
  if (!tab) return "this tab has not started";
  const at = tab.next();
  const made = typeof facts === "function" ? facts(at) : facts;
  return tab.say({ values, facts: Array.isArray(made) ? made : [made] });
}

// ─── The model: the view as a map ──────────────────────────────────────────
// A node is a task. A scope (the spawn call that owns its members) is a
// junction under its owner. Background work a task will hear back from
// hangs off it. Projects are the map's disconnected components.
//
// Edges: solid, a scope and its members (owned, settled together); dashed,
// a result that will arrive without anyone waiting for it now (background
// work); dotted, a task continued by a resume; flowing,
// waited on right now.
let view = null;
let byId = {};
let graph = { nodes: new Map(), edges: [], comps: [] };

// What a task is waiting on, as the map shows it: a class and a few words.
function look(t) {
  const w = t.waiting || {};
  const since = w.since != null ? ` · ${ago(w.since)}` : "";
  switch (w.kind) {
    case "model": return { cls: w.streaming ? "working streaming" : "working", text: (w.streaming ? "writing" : "thinking") + since };
    case "calls": {
      const kids = w.calls.flatMap((c) => c.children);
      if (kids.length) {
        const live = kids.filter((k) => byId[k] && byId[k].waiting?.kind !== "done").length;
        return { cls: "waiting-children", text: `waiting on ${live} of ${kids.length}${since}` };
      }
      const c = w.calls[0] || {};
      return { cls: "working tool", text: `${c.tool || "tools"}${c.input ? " " + gist(c.input) : ""}` };
    }
    case "max": return { cls: "open", text: w.ask ? "asks you" : "your turn" };
    case "starting": return { cls: "starting", text: w.limbs.length ? `making ${w.limbs.join(", ")}` : "starting" };
    case "harness": return { cls: "working", text: "harness" + since };
    case "held": return { cls: "held", text: "held" };
    case "limited": return { cls: "limited", text: `limited until ${clock(w.until)}` };
    case "listening": {
      const asks = (t.background || []).filter((b) => b.limb === "max").length;
      return { cls: "listening", text: asks ? "waits on your answer" : w.calls.length ? `waits on ${w.calls.length} in background` : "listening" };
    }
    case "done": {
      const o = t.outcome || {};
      if (o.kind === "failed") return { cls: "done failed", text: `failed · ${ago(w.since)} ago` };
      if (o.kind === "cancelled") return { cls: "done cancelled", text: `cancelled · ${ago(w.since)} ago` };
      return { cls: "done", text: `done · ${ago(w.since)} ago` };
    }
  }
  return { cls: "", text: w.kind || "" };
}
// Under its owner, a task's name without the owner's name it starts with.
const shortName = (t) => { const o = byId[parentOf(t)]; return o && t.name.startsWith(o.name + "-") ? t.name.slice(o.name.length + 1) : t.name; };
const glyph = (t) => (t.environment || t.name || "?").trim()[0].toUpperCase();
// Tasks in the order they were created.
const order = (a, b) => a.created.seq - b.created.seq;
const isDone = (t) => t.waiting?.kind === "done";
// Who a task belongs to on the map: its scope's owner, or the task a resume
// in Max's own scope continues.
const parentOf = (t) => t.owner || (t.from && byId[t.from] ? t.from : null);
const ancestry = (t) => { const out = []; for (let p = parentOf(t); p && byId[p] && out.length < 50; p = parentOf(byId[p])) out.unshift(byId[p]); return out; };
// The calls a task is waiting on right now.
function awaited(t) {
  const w = t.waiting || {};
  return new Set([...(w.calls || []).map((c) => c.id), ...(w.ask ? [w.ask.id] : [])]);
}

// A finished project folds to its root once it has been finished a while:
// a small card on the archive shelf, below everything live.
const FOLD_AFTER = 30 * 60 * 1000;
const unfolded = new Set();

function derive() {
  byId = Object.fromEntries(view.tasks.map((t) => [t.id, t]));
  const nodes = new Map(), edges = [];
  for (const t of view.tasks) nodes.set(t.id, { id: t.id, kind: "task", t });
  for (const [call, s] of Object.entries(view.scopes)) {
    if (!byId[s.owner]) continue;
    const members = view.tasks.filter((t) => t.scope === call).sort(order);
    const waiting = awaited(byId[s.owner]).has(call);
    nodes.set(`s:${call}`, { id: `s:${call}`, kind: "scope", call, scope: s, members });
    edges.push({ from: s.owner, to: `s:${call}`, kind: s.background ? "receives" : "owns", flow: waiting, made: s.made });
    for (const m of members) edges.push({ from: `s:${call}`, to: m.id, kind: "owns", flow: waiting && !isDone(m), made: m.created.seq });
  }
  for (const t of view.tasks) {
    if (t.scope && !view.scopes[t.scope] && t.owner) edges.push({ from: t.owner, to: t.id, kind: "owns", made: t.created.seq });
    if (t.origin === "resume" && byId[t.from]) edges.push({ from: t.from, to: t.id, kind: "continues" });
    const waits = awaited(t);
    for (const b of t.background || []) {
      if (b.status === "settled" || b.tool === "spawn") continue;
      const id = `b:${b.id}`;
      nodes.set(id, { id, kind: "sat", call: b, task: t.id });
      edges.push({ from: t.id, to: id, kind: "receives", flow: waits.has(b.id) || t.waiting?.kind === "listening", max: b.limb === "max" });
    }
  }
  // Components, by the edges between them.
  const up = new Map([...nodes.keys()].map((k) => [k, k]));
  const find = (k) => { while (up.get(k) !== k) { up.set(k, up.get(up.get(k))); k = up.get(k); } return k; };
  for (const e of edges) if (nodes.has(e.from) && nodes.has(e.to)) up.set(find(e.from), find(e.to));
  const comps = new Map();
  for (const n of nodes.values()) {
    const c = find(n.id);
    if (!comps.has(c)) comps.set(c, { nodes: [], tasks: [] });
    comps.get(c).nodes.push(n);
    if (n.kind === "task") comps.get(c).tasks.push(n.t);
  }
  const now = Date.now();

  const to = $(".to", compose), ask = askOf(t), mid = midTurn(t) && !ask;
  to.className = `to${ask ? " answering" : ""}`;
  to.textContent = ask ? `Answering: ${(parse(ask.input)?.question || "").split("\n")[0].slice(0, 120)}`
    : !mid ? `To ${t.name} · its turn has ended`
    : `To ${t.name} · working: send now to reach it mid-turn, or at its turn's end`;
  $(".later", compose).hidden = !mid;
  $(".send", compose).textContent = ask ? "Answer" : mid ? "Send now" : "Send";
  $(".send", compose).title = "Ctrl+Enter";
}
const say = (text, bad) => { const s = $(".status", compose); if (s) { s.textContent = text; s.className = `status${bad ? " bad" : ""}`; } };
function autosize() { if (!box) return; box.style.height = "auto"; box.style.height = `${Math.min(box.scrollHeight, innerHeight * .4)}px`; }

async function submit(read) {
  if (!box) return;
  const t = byId[box.dataset.key];
  const text = box.value, files = attached.get(t.id);
  if (!text.trim() && !files.length) return;
  if (dictation) return stopDictation();
  say("pending");
  const ask = askOf(t);
  const blocks = [...files.map((a) => a.block), ...(text.trim() ? [{ type: "text", text }] : [])];
  const words = JSON.stringify(blocks), id = digest(words);
  clearTimeout(saving.get(t.id));
  saving.delete(t.id);
  let draft = draftOf(t.id), sent = null;
  // An answer settles the question and discards the draft; anything else
  // sends the draft, opening it first if no pause has yet.
  const why = await act((at) => {
    sent = `${at}.0`;
    if (ask) return [{ Call: [ask.id, { Settled: { Completed: { model: id, full: null, observes: [] } } }] }, ...(draft ? [{ Draft: [draft, "Discarded"] }] : [])];
    const facts = [];
    if (!draft) { draft = sent; facts.push({ Draft: [draft, { Opened: { session: t.id } }] }); }
    facts.push({ Draft: [draft, { Send: { text: id, read } }] });
    return facts;
  }, [words]);
  if (why) return say(`not sent: ${why}`, true);
  const rows = view.drafts;
  const successor = !ask && rows.find((d) => d.id === sent && d.from === draft);
  const held = !ask && rows.find((d) => d.id === draft && d.held);
  local.delete(draft);
  if (successor) {
    bound.set(t.id, successor.id);
    renderOthers();
    return say("another device sent this draft first: your words are a new draft, beside it", true);
  }
  if (held) { bound.delete(t.id); renderOthers(); return say(`held, not heard: ${held.held}`, true); }
  bound.delete(t.id);
  if (box.value === text) { box.value = prev = ""; autosize(); }
  renderTray();
  renderOthers();
  say(ask ? "answered" : read === "TurnEnd" ? `${t.name} reads it when its turn ends` : `sent to ${t.name}`);
}

let prev = "";
function onInput() {
  const now = box.value;
  if (dictation && dictation.key === box.dataset.key) {
    let x = 0;
    while (x < prev.length && x < now.length && prev[x] === now[x]) x++;
    let tail = 0;
    while (tail < prev.length - x && tail < now.length - x && prev[prev.length - 1 - tail] === now[now.length - 1 - tail]) tail++;
    const removed = prev.length - x - tail, inserted = now.length - x - tail;
    const l = dictation;
    const end = l.start + l.T.length - l.P;
    if (x + removed <= l.start && !(x === l.start && removed === 0 && l.T.length === l.P)) l.start += inserted - removed;
    else if (x <= end) { l.P = Math.min(l.T.length, l.P + Math.max(0, x + removed - l.start)); l.start = x + inserted; }
  }
  prev = now;
  drafts.set(box.dataset.key, now);
  autosize();
}

// The endpoint's edits, in the transcript's own offsets, last first so the
// earlier offsets still hold. If Max has gone to another node meanwhile,
// they land in the draft of the node he was dictating to.
function applyEdits(edits) {
  const l = dictation;
  const shown = box && box.dataset.key === l.key;
  const target = shown ? box : Object.assign(document.createElement("textarea"), { value: drafts.get(l.key) });
  const end = () => l.start + l.T.length - l.P;
  const following = shown && target.selectionStart === target.selectionEnd && target.selectionEnd === end();
  for (const e of [...edits].reverse()) {
    if (e.at >= l.P) { const from = l.start + e.at - l.P; target.setRangeText(e.put, from, from + e.cut, "preserve"); }
    else if (e.at + e.cut <= l.P) l.P += e.put.length - e.cut;
    else { target.setRangeText(e.put, l.start, l.start + e.at + e.cut - l.P, "preserve"); l.P = e.at; }
    l.T = l.T.slice(0, e.at) + e.put + l.T.slice(e.at + e.cut);
  }
  if (following) target.setSelectionRange(end(), end());
  drafts.set(l.key, target.value);
  if (shown) { prev = box.value; autosize(); }
}

// The microphone as 16-bit PCM, in chunks of a tenth of a second.
const WORKLET = URL.createObjectURL(new Blob([`
registerProcessor("pcm", class extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(sampleRate / 10); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(sampleRate / 10); this.n = 0;
      }
    }
    return true;
  }
});`], { type: "application/javascript" }));

async function dictate(sample) {
  if (dictation) return stopDictation();
  if (!box) return;
  let rate = 16000, mic = null;
  try {
    if (!sample) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new AudioContext();
      await ctx.audioWorklet.addModule(WORKLET);
      const node = new AudioWorkletNode(ctx, "pcm");
      ctx.createMediaStreamSource(stream).connect(node);
      rate = ctx.sampleRate;
      mic = { stream, ctx, node };
    }
  } catch (e) { return say(`no microphone: ${e.message}`, true); }
  // Dictation goes in at the caret, a space from the word before it.
  let at = box.selectionEnd;
  if (at > 0 && !/\s/.test(box.value[at - 1])) { box.setRangeText(" ", at, at, "end"); at += 1; prev = box.value; }
  const ws = new WebSocket(`wss://${location.host}/dictation?rate=${rate}${sample ? "&sample" : ""}`);
  ws.binaryType = "arraybuffer";
  dictation = { ws, mic, key: box.dataset.key, T: "", P: 0, start: at };
  if (mic) mic.node.port.onmessage = (m) => { if (ws.readyState === 1) ws.send(m.data); };
  const b = $(".mic", compose); if (b) { b.classList.add("on"); b.textContent = "Stop"; }
  say("connecting");
  const l = dictation;
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.listening) say(sample ? "dictating the sample" : "listening");
    if (d.edits && dictation === l) applyEdits(d.edits);
    if (d.error) say(d.error, true);
    if (d.final) finishDictation(l);
  };
  ws.onclose = () => finishDictation(l);
  box.focus();
}
function releaseMic(l) {
  if (!l.mic) return;
  l.mic.stream.getTracks().forEach((t) => t.stop());
  l.mic.ctx.close();
  l.mic = null;
}
function stopDictation() {
  if (!dictation) return;
  releaseMic(dictation);
  if (dictation.ws.readyState === 1) dictation.ws.send(JSON.stringify({ type: "stop" }));
  say("finishing");
}
function finishDictation(l) {
  if (dictation !== l) return;
  releaseMic(l);
  dictation = null;
  l.ws.close();
  const b = $(".mic", compose); if (b) { b.classList.remove("on"); b.textContent = "Dictate"; }
  if (!$(".status", compose)?.classList.contains("bad")) say("");
}

// ─── A new task, in Max's own scope ───────────────────────────────────────
const sheet = $("#sheet");
// The new task's fields are kept in this tab across reloads: a draft is
// attached to a session, and this one has none yet.
function kept(input, key) {
  input.value = sessionStorage.getItem(key) || "";
  input.addEventListener("input", () => sessionStorage.setItem(key, input.value));
}
for (const [id, key] of [["#s-name", "new:name"], ["#s-dir", "new:dir"], ["#s-mandate", "new:mandate"]]) kept($(id), key);
const openSheet = () => {
  sheet.hidden = !sheet.hidden;
  if (sheet.hidden || !view) return;
  const role = $("#s-role");
  const chosen = role.value;
  role.replaceChildren(...view.environments.map((e) => { const o = el("option", null, e.name); o.value = e.id; return o; }));
  if (chosen) role.value = chosen;
  $("#s-dirs").replaceChildren(...view.workspaces.map((w) => { const o = el("option"); o.value = w.dir; return o; }));
  $("#s-mandate").focus();
};
$("#new").onclick = openSheet;
$("#empty-new").onclick = openSheet;
$("#s-cancel").onclick = () => { sheet.hidden = true; };
let startArmed = false;
for (const f of sheet.querySelectorAll("input, textarea, select")) f.addEventListener("input", () => { startArmed = false; $("#s-go").classList.remove("armed"); $("#s-go").textContent = "Start"; });
sheet.onsubmit = async (e) => {
  e.preventDefault();
  const answer = $(".answer", sheet);
  const env = view.environments.find((x) => x.id === $("#s-role").value);
  const mandate = $("#s-mandate").value.trim();
  if (!env || !mandate) { answer.textContent = "a role and a mandate"; return; }
  const dir = $("#s-dir").value.trim();
  if (env.places.length && !dir) { answer.textContent = `a directory for its ${env.places[0]}`; return; }
  if (!startArmed) { startArmed = true; $("#s-go").classList.add("armed"); $("#s-go").textContent = "Start now"; answer.textContent = "again to start"; return; }
  startArmed = false; $("#s-go").classList.remove("armed"); $("#s-go").textContent = "Start";
  const text = digest(mandate);
  let id;
  const facts = (at) => {
    // What this record creates: a limb for each new directory, then the task.
    let i = 0;
    const out = [], places = {};
    for (const place of env.places) {
      const known = view.workspaces.find((w) => w.dir === dir);
      const limb = known ? known.id : `${at}.${i++}`;
      if (!known) out.push({ Limb: { id: limb, name: dir, kind: { Plugin: { kind: place, config: JSON.stringify({ dir }) } } } });
      places[place] = limb;
    }
    id = `${at}.${i}`;
    out.push({ Task: [id, { Created: {
      name: $("#s-name").value.trim() || env.name, by: null, scope: "Max",
      origin: { Fresh: { environment: env.id, places } },
      mode: "UserFacing",
      mandate: { text, brief: null, quotes: [] },
    } }] });
    return out;
  };
  const why = await act(facts, [mandate]);
  answer.className = why ? "answer bad" : "answer";
  answer.textContent = why ? `refused: ${why}` : "started";
  if (why) return;
  for (const k of ["new:name", "new:mandate"]) sessionStorage.removeItem(k);
  $("#s-mandate").value = ""; $("#s-name").value = "";
  sheet.hidden = true;
  pendingOpen = id;
};

$("#fit").onclick = () => fit(true);
addEventListener("resize", () => { shape = ""; refresh(); });

// ─── The view ──────────────────────────────────────────────────────────────
// The tab's rows, one per object, as the page draws them.
function assemble(v) {
  const out = { as_of: v.as_of, seq: Number(v.as_of.split(".")[1]), tasks: [], scopes: {}, queue: [], drafts: [], environments: [], workspaces: [] };
  for (const [key, row] of Object.entries(v.rows)) {
    const id = key.slice(key.indexOf(":") + 1);
    if (row.Task) out.tasks.push(row.Task);
    else if (row.Scope) out.scopes[id] = row.Scope;
    else if (row.Queue) out.queue = row.Queue;
    else if (row.Harness) Object.assign(out, row.Harness);
    else if (row.Draft) out.drafts.push({ id, ...row.Draft });
  }
  return out;
}
async function viewArrived(fresh) {
  if (fresh === null) { $("#link").className = "down"; $("#link").title = "reconnecting"; return; }
  $("#link").className = ""; $("#link").title = "live";
  if (fresh) liveReset();
  view = assemble(tab.view());
  settleLocal();
  await refresh();
  if (pendingOpen && byId[pendingOpen]) { const id = pendingOpen; pendingOpen = null; go(id); }
  else if (!openId && location.hash.length > 1 && byId[location.hash.slice(1)] && !moving.started) { moving.started = true; route(); }
}
start().catch((e) => { $("#link").className = "down"; $("#link").title = `this tab could not start: ${e}`; console.error(e); });
// Waits grow between events.
setInterval(() => { if (view) { drawMapText(); if (openId) renderPanel(); } }, 1000);
function drawMapText() {
  for (const [id, a] of nodeEls) {
    const n = graph.nodes.get(id);
    if (n?.kind !== "task") continue;
    const st = $(".status", a), fc = graph.comps.find((c) => c.folded && c.root.id === id);
    st.textContent = fc ? cardStatus(fc) : trouble(n.t) || look(n.t).text;
  }
}
