<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness</title>
<style>
  :root {
    --ground: #f0eee6; --paper: #faf9f5; --line: #e0dccf; --ink: #141413;
    --muted: #6b6a64; --maroon: #7a1f22; --hover: #e8e4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: .3em 1.5em; align-items: baseline; padding: .7em 1.2em;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font: 600 1.15em ui-serif, Georgia, serif; margin: 0; }
  header .meta { color: var(--muted); }
  #link.down { color: var(--maroon); font-weight: 600; }
  #refused, .alarm { color: var(--maroon); font-weight: 600; }
  main {
    display: grid; gap: 1em; padding: 1em 1.2em;
    grid-template-columns: minmax(22em, 1fr) minmax(26em, 1.4fr);
    grid-template-areas: "queue detail" "tree detail" "facts compose";
    grid-template-rows: auto 1fr auto;
    height: calc(100vh - 3em);
  }
  section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
  section > h2 {
    font: 600 .8em ui-sans-serif, system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin: 0; padding: .7em 1em .3em;
  }
  #queue { grid-area: queue; } #tree { grid-area: tree; }
  #facts { grid-area: facts; max-height: 14em; } #detail { grid-area: detail; }
  #compose { grid-area: compose; display: flex; flex-direction: column; overflow: hidden; }
  #compose h2 .to { text-transform: none; letter-spacing: 0; color: var(--ink); }
  #box {
    flex: 1; min-height: 6em; margin: 0 1em; padding: .5em .6em; resize: none;
    font: inherit; color: var(--ink); background: var(--ground);
    border: 1px solid var(--line); border-radius: 6px;
  }
  #box:focus { outline: 2px solid var(--maroon); outline-offset: -1px; }
  #compose .controls { display: flex; gap: .6em; align-items: center; padding: .5em 1em .7em; }
  #mic.on { background: var(--maroon); color: var(--paper); border-color: var(--maroon); }
  #status { color: var(--muted); flex: 1; }
  #status.bad { color: var(--maroon); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  .task { padding: .25em 1em .25em calc(1em + var(--depth) * 1.3em); cursor: pointer; }
  .task:hover { background: var(--hover); }
  .task.selected { background: var(--hover); box-shadow: inset 3px 0 var(--maroon); }
  .name { font-weight: 600; }
  .tag { color: var(--muted); font-size: .85em; margin-left: .4em; }
  .throb { display: block; color: var(--muted); font-size: .9em; }
  .throb.max, .throb.failed { color: var(--maroon); font-weight: 600; }
  .throb .spin { display: inline-block; width: 1.1em; }
  .done .name { color: var(--muted); font-weight: 500; }
  .queued { padding: .4em 1em; cursor: pointer; border-top: 1px solid var(--line); }
  .queued:first-of-type { border-top: 0; }
  .queued:hover { background: var(--hover); }
  .queued .name { color: var(--maroon); }
  .queued .why, .queued .ask { display: block; color: var(--ink); font-size: .9em; }
  .empty { color: var(--muted); padding: .2em 1em .8em; }
  #facts li { padding: .05em 1em; font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; }
  #facts .seq, #facts .at { color: var(--muted); }
  #facts .Max { color: var(--maroon); }
  #detail .body { padding: 0 1em 1em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .2em 1em; margin: .3em 0 1em; }
  dt { color: var(--muted); } dd { margin: 0; }
  .mandate { white-space: pre-wrap; }
  .entry { border-top: 1px solid var(--line); padding: .6em 0; }
  .entry .role { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .entry.assistant .role { color: var(--maroon); }
  .entry.head { box-shadow: inset 3px 0 var(--maroon); padding-left: .7em; }
  .block { white-space: pre-wrap; margin: .25em 0; }
  .block.tool { font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; background: var(--ground); padding: .3em .5em; border-radius: 4px; }
  details summary { cursor: pointer; color: var(--muted); }
  button {
    font: inherit; padding: .2em .7em; border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button:disabled { color: var(--muted); cursor: default; background: var(--paper); }
  .controls-row { display: flex; gap: .5em; align-items: center; flex-wrap: wrap; margin: .2em 0 .8em; }
  .answer { color: var(--muted); }
  #start[hidden] { display: none; }
  #start { display: flex; flex-wrap: wrap; gap: .4em .8em; padding: .3em 1em .6em; border-bottom: 1px solid var(--line); }
  #start textarea { flex-basis: 100%; font: inherit; padding: .4em .5em; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; }
  #start input, #start select { font: inherit; }
  .answer.bad { color: var(--maroon); font-weight: 600; }
  section > h2 button { text-transform: none; letter-spacing: 0; font-size: 1.1em; margin-left: .8em; }
  .queued .move { float: right; display: flex; gap: .3em; }
  .queued .move button { padding: 0 .45em; }
  .stream { border-top: 1px solid var(--line); padding: .6em 0; }
  .stream .role { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--maroon); }
  .block.thinking { color: var(--muted); font-style: italic; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, monospace; margin: .3em 0; }
  .block { overflow-wrap: anywhere; }
  .stream .command { font: 12px/1.5 ui-monospace, monospace; color: var(--maroon); }
  .trouble { display: block; color: var(--maroon); font-size: .9em; }
  .output { background: var(--ground); padding: .3em .5em; border-radius: 4px; max-height: 30em; overflow: auto; }
  @media (max-width: 800px) {
    main {
      grid-template-columns: 1fr; grid-template-rows: none; height: auto;
      grid-template-areas: "queue" "tree" "detail" "compose" "facts";
    }
    #tree { max-height: 45vh; } #detail { max-height: 75vh; }
    #compose { min-height: 12em; }
  }
</style>
</head>
<body>
<header>
  <h1>harness</h1>
  <span class="meta" id="build"></span>
  <span class="meta" id="seq"></span>
  <span class="meta" id="usage"></span>
  <span class="meta" id="link">connecting</span>
  <span id="refused"></span>
</header>
<main>
  <section id="queue"><h2>Waiting on you<button id="next" hidden>Next</button></h2><ul></ul></section>
  <section id="tree"><h2>Tasks<button id="new">New task</button></h2>
    <form id="start" hidden>
      <label>Role <select id="role"></select></label>
      <label>Name <input id="tname" placeholder="the role's name"></label>
      <label>Directory <input id="dir" list="dirs" placeholder="/path/to/your/clone" size="34"></label>
      <datalist id="dirs"></datalist>
      <label><input type="checkbox" id="chat"> a chat with you</label>
      <textarea id="mandate" placeholder="The mandate: what to do, and what to report." rows="4"></textarea>
      <div class="controls-row"><button id="go" type="submit">Start</button><span class="answer" id="started"></span></div>
    </form>
    <ul></ul></section>
  <section id="facts"><h2>Journal</h2><ul></ul></section>
  <section id="detail"><h2>Task</h2><div class="body"><p class="empty">Select a task.</p></div></section>
  <section id="compose">
    <h2>To <span class="to" id="to">no task selected</span></h2>
    <textarea id="box" placeholder="Write, paste or dictate. Enter is a new line; Ctrl+Enter sends." spellcheck="true"></textarea>
    <div class="controls">
      <button id="mic" hidden>Dictate</button>
      <button id="sample" hidden>Dictate the sample</button>
      <span id="status"></span>
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour12: false });
const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
};
const FRAMES = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

let view = null;
let selected = location.hash.slice(1) || null;
let shownHead = null;
const facts = [];

// What the task waits on: a glyph, words, and since when.
function throbber(t) {
  const w = t.waiting;
  if (!w) return { cls: "", spin: "", text: "" };
  const since = w.since != null ? ` · ${ago(w.since)}` : "";
  switch (w.kind) {
    case "model":
      return { cls: "model", spin: true, text: (w.streaming ? "model streaming" : "model, before the first byte") + since };
    case "calls": {
      const kids = w.calls.flatMap((c) => c.children);
      if (kids.length) {
        const live = kids.filter((k) => byId[k] && byId[k].waiting && byId[k].waiting.kind !== "done").length;
        return { cls: "children", spin: true, text: `${live} of ${kids.length} children running${since}` };
      }
      const tools = w.calls.map((c) => `${c.tool}${c.status === "made" ? " (queued)" : ""}${gist(c.input)}`).join(", ");
      return { cls: "tool", spin: true, text: `tool: ${tools}${since}` };
    }
    case "max": return { cls: "max", spin: "●", text: (w.ask ? "asked you" : "your turn") + since };
    case "starting": return { cls: "harness", spin: true, text: (w.limbs.length ? `making ${w.limbs.join(", ")}…` : "starting") + since };
    case "harness": return { cls: "harness", spin: true, text: "harness: preparing the next request" };
    case "held": return { cls: "held", spin: "‖", text: "held" };
    case "limited": return { cls: "limited", spin: "⧗", text: `usage limit until ${clock(w.until)}` };
    case "listening": return { cls: "listening", spin: "◦", text: w.calls.length ? `listening, ${w.calls.length} background` : "listening" };
    case "done": {
      const o = t.outcome || {};
      if (o.kind === "failed") return { cls: "failed", spin: "✗", text: `failed: ${o.reason}` };
      if (o.kind === "cancelled") return { cls: "done", spin: "■", text: `cancelled by ${o.by}` };
      return { cls: "done", spin: "✓", text: "done" };
    }
  }
  return { cls: "", spin: "", text: w.kind };
}

let byId = {};

// What the subscription has used, as the latest response reported it, and
// whether the account is stopped.
const PLAN = (claim) => claim == null || claim === "five_hour" || claim.startsWith("seven_day");
const pct = (f) => f == null ? "?" : `${Math.round(f * 100)}%`;
// When a window resets: the time today, else the weekday and time.
const resets = (ms) => {
  if (ms == null) return "";
  const d = new Date(ms), hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  return d.toDateString() === new Date().toDateString() ? ` (resets ${hm})` : ` (resets ${d.toLocaleDateString([], { weekday: "short" })} ${hm})`;
};
function renderUsage() {
  const u = view.usage, span = $("#usage");
  span.replaceChildren();
  if (u) span.append(`used: 5h ${pct(u.five_hour)}${resets(u.five_hour_reset)} · 7d ${pct(u.seven_day)}${resets(u.seven_day_reset)} · as of ${clock(u.at)}`);
  if (u && !PLAN(u.claim)) span.append(" ", el("span", "alarm", `billed as ${u.claim}, not the plan: nothing more is sent`));
  if (view.limited) span.append(" ", el("span", "alarm", `account limited until ${clock(view.limited)}`));
}

// Why a task's last turn did not respond, while it matters.
function trouble(t) {
  const x = t.trouble;
  if (!x || t.waiting?.kind === "done") return null;
  if (x.until != null) return x.until > Date.now() ? `limited until ${clock(x.until)}` : null;
  return t.failures ? `failed ${t.failures}× in a row, last ${ago(x.at)} ago: ${x.text}` : null;
}

// The gist of a call's input: its command, or the path or pattern it names.
function gist(input) {
  let v;
  try { v = JSON.parse(input); } catch { return ""; }
  const s = v && (v.command ?? v.path ?? v.pattern ?? v.name);
  if (typeof s !== "string") return "";
  const line = s.split("\n")[0];
  return `: ${line.length > 70 ? line.slice(0, 70) + "…" : line}`;
}

function render() {
  if (!view) return;
  byId = Object.fromEntries(view.tasks.map((t) => [t.id, t]));
  $("#build").textContent = view.build ? `build ${view.build}` : "";
  $("#seq").textContent = `seq ${view.seq}`;
  $("#refused").textContent = view.refused || "";
  renderUsage();

  // Max's queue, in the order the core derives.
  const queue = $("#queue ul");
  queue.replaceChildren();
  view.queue.forEach((q, i) => {
    const t = byId[q.task];
    const li = el("li", "queued");
    const move = el("span", "move");
    for (const [label, to] of [["↑", i - 1], ["↓", i + 1]]) {
      const b = el("button", null, label);
      b.disabled = !can.act || to < 0 || to >= view.queue.length;
      b.onclick = (e) => { e.stopPropagation(); reorder(i, to); };
      move.append(b);
    }
    li.append(move, el("span", "name", t.name), el("span", "tag", `waiting ${ago(q.since)}`));
    if (q.ask) li.append(el("span", "ask", `asks: ${preview(q.ask.input)}`));
    li.append(el("span", "why", q.why ? q.why : "unranked"));
    li.onclick = () => select(q.task);
    queue.append(li);
  });
  if (!view.queue.length) queue.append(el("li", "empty", "Nothing needs you."));
  const next = view.queue[0];
  $("#next").hidden = !next || next.task === selected;
  if (next) $("#next").textContent = `Next: ${byId[next.task].name}`;

  // The tree: Max's scope at the top, each task under the task that owns it,
  // an aside under the task it was opened on.
  const parent = (t) => t.owner || (t.origin === "aside" ? t.from : null);
  const kids = {};
  for (const t of view.tasks) (kids[parent(t)] ||= []).push(t);
  const tree = $("#tree ul");
  tree.replaceChildren();
  const walk = (id, depth) => {
    for (const t of kids[id] || []) {
      tree.append(row(t, depth));
      walk(t.id, depth + 1);
    }
  };
  walk(null, 0);
  if (!view.tasks.length) tree.append(el("li", "empty", "No tasks yet."));

  renderDetail();
  renderTo();
}

// Max's own order for his queue: the whole order, as the scheduler would
// write it, each task keeping its reason.
async function reorder(from, to) {
  const order = view.queue.map((q) => ({ task: q.task, why: q.why || "placed by you" }));
  order.splice(to, 0, ...order.splice(from, 1));
  order[to].why = "placed by you";
  const why = await act({ Ranking: { order } });
  if (why) alert(`queue not reordered: ${why}`);
}

$("#next").onclick = () => { select(view.queue[0].task); box.focus(); };

function row(t, depth) {
  const li = el("li", "task");
  li.style.setProperty("--depth", depth);
  if (t.id === selected) li.classList.add("selected");
  if (t.waiting && t.waiting.kind === "done") li.classList.add("done");
  li.append(el("span", "name", t.name), el("span", "tag", t.environment || ""));
  for (const limb of Object.values(t.places || {})) li.append(el("span", "tag", `in ${limb}`));
  if (t.origin !== "fresh") li.append(el("span", "tag", `${t.origin} of ${byId[t.from] ? byId[t.from].name : t.from}`));
  if (t.held) li.append(el("span", "tag", "held"));
  if (t.draining) li.append(el("span", "tag", `draining: ${t.draining}`));
  const th = throbber(t);
  const line = el("span", `throb ${th.cls}`);
  const spin = el("span", "spin", th.spin === true ? "" : th.spin);
  if (th.spin === true) spin.dataset.spin = "1";
  line.append(spin, document.createTextNode(th.text));
  li.append(line);
  const bad = trouble(t);
  if (bad) li.append(el("span", "trouble", bad));
  li.onclick = () => select(t.id);
  return li;
}

// Selecting a task is focusing on it: a fact, so nothing moves the task
// Max is in from under him.
function select(id) {
  if (selected !== id && can.act) act({ Focus: { face: FACE, task: id } });
  selected = id;
  history.replaceState(null, "", `#${id}`);
  render();
}

// Max's facts. This page is one face, with an id it keeps. Each fact is
// posted in the journal's own encoding and the brain folds it before it
// appends it, so a refusal names the core's reason. A post that the
// connection dropped is sent again: what the page creates carries an id it
// minted, so the core refuses a second copy ("creates something that already exists"), which means the first
// one landed.
const mint = () => [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, "0")).join("");
const FACE = localStorage.getItem("face") || mint();
localStorage.setItem("face", FACE);

// Max's facts, with the text of each value they name, in one batch.
async function act(facts, values = []) {
  if (!can.act) return "this face is not wired to a brain";
  const batch = { values, facts: Array.isArray(facts) ? facts : [facts] };
  const body = JSON.stringify({ face: FACE, seen: view.seq, batch });
  for (let attempt = 0; ; attempt++) {
    let res;
    try {
      res = await fetch("/act", { method: "POST", body });
    } catch {
      await new Promise((r) => setTimeout(r, 1000 * Math.min(attempt + 1, 5)));
      continue;
    }
    if (res.ok) return null;
    const why = await res.text();
    if (attempt > 0 && why === "creates something that already exists") return null;
    return why || res.statusText;
  }
}

// The answer to a control, beside it: done, or the core's refusal.
async function control(fact, answer, done) {
  answer.className = "answer";
  answer.textContent = "…";
  const why = await act(fact);
  answer.className = why ? "answer bad" : "answer";
  answer.textContent = why ? `refused: ${why}` : done;
}

// The compose box. Its text is Max's until he sends it, kept across
// reloads. Dictation streams into it as edits to a live region, which he can
// edit too: an edit inside the region pins the text up to the end of his
// edit, and the words still coming go after it.

const box = $("#box");
let can = { act: false, dictation: false, sample: false };
let prev = box.value = localStorage.getItem("draft") || "";
let live = null;

const say = (text, bad) => { $("#status").textContent = text; $("#status").className = bad ? "bad" : ""; };

fetch("/wiring").then((r) => r.json()).then((c) => {
  can = c;
  $("#mic").hidden = !c.dictation;
  $("#sample").hidden = !c.sample;
});

function renderTo() {
  const t = selected && byId[selected];
  $("#to").textContent = t ? t.name : "no task selected";
}

// One input from Max: one contiguous change, found by trimming what is the
// same at both ends.
box.addEventListener("input", () => {
  const now = box.value;
  let x = 0;
  while (x < prev.length && x < now.length && prev[x] === now[x]) x++;
  let tail = 0;
  while (tail < prev.length - x && tail < now.length - x && prev[prev.length - 1 - tail] === now[now.length - 1 - tail]) tail++;
  const removed = prev.length - x - tail, inserted = now.length - x - tail;
  if (live) {
    const end = live.start + live.T.length - live.P;
    if (x + removed <= live.start && !(x === live.start && removed === 0 && live.T.length === live.P)) {
      live.start += inserted - removed;
    } else if (x <= end) {
      live.P = Math.min(live.T.length, live.P + Math.max(0, x + removed - live.start));
      live.start = x + inserted;
    }
  }
  prev = now;
  localStorage.setItem("draft", now);
});

// The endpoint's edits, in the transcript's own offsets, last first so the
// earlier offsets still hold.
function applyEdits(edits) {
  const l = live;
  const end = () => l.start + l.T.length - l.P;
  const following = box.selectionStart === box.selectionEnd && box.selectionEnd === end();
  for (const e of [...edits].reverse()) {
    if (e.at >= l.P) {
      const from = l.start + e.at - l.P;
      box.setRangeText(e.put, from, from + e.cut, "preserve");
    } else if (e.at + e.cut <= l.P) {
      l.P += e.put.length - e.cut;
    } else {
      box.setRangeText(e.put, l.start, l.start + e.at + e.cut - l.P, "preserve");
      l.P = e.at;
    }
    l.T = l.T.slice(0, e.at) + e.put + l.T.slice(e.at + e.cut);
  }
  // A caret at the end of the words keeps following them.
  if (following) box.setSelectionRange(end(), end());
  prev = box.value;
  localStorage.setItem("draft", prev);
}

// The microphone as 16-bit PCM, in chunks of a tenth of a second.
const WORKLET = URL.createObjectURL(new Blob([`
registerProcessor("pcm", class extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(sampleRate / 10); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(sampleRate / 10); this.n = 0;
      }
    }
    return true;
  }
});`], { type: "application/javascript" }));

async function dictate(sample) {
  if (live) return stopDictation();
  let rate = 16000, mic = null;
  try {
    if (!sample) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new AudioContext();
      await ctx.audioWorklet.addModule(WORKLET);
      const node = new AudioWorkletNode(ctx, "pcm");
      ctx.createMediaStreamSource(stream).connect(node);
      rate = ctx.sampleRate;
      mic = { stream, ctx, node };
    }
  } catch (e) {
    return say(`no microphone: ${e.message}`, true);
  }
  // Dictation goes in at the caret, a space from the word before it.
  let at = box.selectionEnd;
  if (at > 0 && !/\s/.test(box.value[at - 1])) {
    box.setRangeText(" ", at, at, "end");
    at += 1;
    prev = box.value;
  }
  const ws = new WebSocket(`wss://${location.host}/dictation?rate=${rate}${sample ? "&sample" : ""}`);
  ws.binaryType = "arraybuffer";
  live = { ws, mic, T: "", P: 0, start: at, thenSend: false };
  if (mic) mic.node.port.onmessage = (m) => { if (ws.readyState === 1) ws.send(m.data); };
  $("#mic").classList.add("on");
  $("#mic").textContent = "Stop";
  $("#sample").disabled = true;
  say("connecting");
  const l = live;
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.listening) say(sample ? "dictating the sample" : "listening");
    if (d.edits && live === l) applyEdits(d.edits);
    if (d.error) say(d.error, true);
    if (d.final) finishDictation(l);
  };
  ws.onclose = () => finishDictation(l);
  box.focus();
}

function releaseMic(l) {
  if (!l.mic) return;
  l.mic.stream.getTracks().forEach((t) => t.stop());
  l.mic.ctx.close();
  l.mic = null;
}

function stopDictation() {
  if (!live) return;
  releaseMic(live);
  if (live.ws.readyState === 1) live.ws.send(JSON.stringify({ type: "stop" }));
  say("finishing");
  box.focus();
}

function finishDictation(l) {
  if (live !== l) return;
  releaseMic(l);
  live = null;
  l.ws.close();
  $("#mic").classList.remove("on");
  $("#mic").textContent = "Dictate";
  $("#sample").disabled = false;
  if ($("#status").className !== "bad") say("");
  if (l.thenSend) send();
}

async function send() {
  if (live) { live.thenSend = true; return stopDictation(); }
  const t = selected && byId[selected];
  if (!t) return say("select a task to send to", true);
  if (!box.value.trim()) return;
  const text = box.value;
  say("sending");
  const words = JSON.stringify([{ type: "text", text }]);
  let why;
  try {
    const id = await (await fetch("/digest", { method: "POST", body: words })).text();
    why = await act({ Delivery: { id: mint(), to: t.id, content: { Words: id } } }, [words]);
  } catch (e) {
    why = String(e);
  }
  if (why) return say(`not sent: ${why}`, true);
  if (box.value === text) { box.value = prev = ""; localStorage.removeItem("draft"); }
  say(`sent to ${t.name}`);
}

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
$("#send").onclick = send;

// Starting a task in Max's own scope: a role, a directory for each of its
// places (the workspace limb already there, or a new one), and a mandate.
$("#new").onclick = () => {
  const form = $("#start");
  form.hidden = !form.hidden;
  if (form.hidden) return;
  $("#role").replaceChildren(...view.environments.map((e) => { const o = el("option", null, e.name); o.value = e.id; return o; }));
  $("#dirs").replaceChildren(...view.workspaces.map((w) => { const o = el("option"); o.value = w.dir; return o; }));
};
$("#start").onsubmit = async (e) => {
  e.preventDefault();
  const env = view.environments.find((x) => x.id === $("#role").value);
  const mandate = $("#mandate").value.trim();
  const answer = $("#started");
  if (!env || !mandate) { answer.textContent = "a role and a mandate"; return; }
  const dir = $("#dir").value.trim();
  const facts = [], places = {};
  for (const place of env.places) {
    if (!dir) { answer.textContent = `a directory for its ${place.name}`; return; }
    const known = view.workspaces.find((w) => w.dir === dir);
    const id = known ? known.id : mint();
    if (!known) facts.push({ Limb: { id, name: dir.split("/").pop(), fork: "Share",
      kind: { Plugin: { kind: place.kind, config: JSON.stringify({ dir }), host: { Process: "Local" } } } } });
    places[place.name] = id;
  }
  const text = await (await fetch("/digest", { method: "POST", body: mandate })).text();
  facts.push({ Task: [mint(), { Created: {
    name: $("#tname").value.trim() || env.name, by: null, scope: "Max",
    origin: { Fresh: { environment: env.id, places } },
    mode: $("#chat").checked ? "UserFacing" : "Autonomous",
    mandate: { text, brief: null, quotes: [], from: "Max" },
  } }] });
  const why = await act(facts, [mandate]);
  answer.className = why ? "answer bad" : "answer";
  answer.textContent = why ? `refused: ${why}` : "started";
  if (!why) { $("#mandate").value = ""; $("#start").hidden = true; }
};
$("#mic").onclick = () => dictate(false);
$("#sample").onclick = () => dictate(true);

function renderDetail() {
  const body = $("#detail .body");
  const t = selected && byId[selected];
  if (!t) return;
  if (body.dataset.task !== t.id) {
    body.dataset.task = t.id;
    shownHead = null;
    for (const s of streams.values()) s.source.close();
    streams.clear();
    toBottom = true;
    const controls = el("div", "controls-row");
    const answer = el("span", "answer");
    const button = (name, label, fact, done) => {
      const b = el("button", null, label);
      b.name = name;
      b.onclick = () => control(fact(), answer, done());
      controls.append(b);
    };
    button("interrupt", "Interrupt", () => ({ Task: [t.id, { Drain: "ToMax" }] }), () => "interrupted: your move once it stops");
    button("stop", "Stop", () => ({ Task: [t.id, { Drain: { Stop: "Max" } }] }), () => "stopping");
    button("hold", "Hold", () => ({ Task: [t.id, { Held: !byId[t.id].held }] }), () => byId[t.id].held ? "released" : "held");
    controls.append(answer);
    body.replaceChildren(controls, el("dl"), el("div", "context"), el("div", "live"));
  }
  for (const b of body.querySelectorAll(".controls-row button")) b.disabled = !can.act || t.waiting?.kind === "done";
  body.querySelector("button[name=hold]").textContent = t.held ? "Release" : "Hold";
  const dl = body.querySelector("dl");
  dl.replaceChildren();
  const th = throbber(t);
  const fields = [
    ["task", t.name], ["agent", t.agent], ["mode", t.mode], ["environment", t.environment],
    ["waiting on", th.text], ["pending inputs", t.pending], ["trouble", trouble(t)],
  ];
  for (const [k, v] of fields) if (v != null) dl.append(el("dt", null, k), el("dd", null, String(v ?? "")));
  dl.append(el("dt", null, "mandate"), el("dd", "mandate", t.mandate));
  if (t.head !== shownHead) {
    shownHead = t.head;
    loadContext(t.head, body.querySelector(".context"));
  }
  const w = t.waiting;
  const into = body.querySelector(".live");
  if (w?.kind === "model") follow("model", w.call, into, null);
  for (const c of w?.calls || []) if (c.status === "running" && !c.children.length) follow("call", c.id, into, c);
}

// The detail pane keeps to its bottom while Max is there, so live text
// scrolls into view; once he scrolls up, it stays where he is.
let toBottom = false;
function stick(change) {
  const pane = $("#detail");
  const atBottom = toBottom || pane.scrollHeight - pane.scrollTop - pane.clientHeight < 60;
  change();
  if (atBottom) pane.scrollTop = pane.scrollHeight;
}

// A command's output as a terminal would leave it: a carriage return starts
// its line again. Only the last lines are shown.
const SHOWN = 400;
function screen(raw) {
  const lines = raw.replace(/\r\n/g, "\n").split("\n").map((l) => l.slice(l.lastIndexOf("\r") + 1));
  return (lines.length > SHOWN ? [`[${lines.length - SHOWN} earlier lines]`, ...lines.slice(-SHOWN)] : lines).join("\n");
}


// What the selected task is running, as it streams: a request's text, or
// a command's output as it prints. Neither is a fact, so each is read from
// /live, which resumes from the last event on a reconnect and says "end" when
// it is over. What has ended stays until the head moves past it and the
// context shows what was kept.
const streams = new Map();
function follow(kind, id, into, call) {
  const key = `${kind}:${id}`;
  if (streams.has(key)) return;
  const source = new EventSource(`/live?${kind}=${id}`);
  const div = el("div", "stream");
  const head = kind === "model" ? el("div", "role", "streaming") : el("div", "command", `running ${call.tool}${gist(call.input)}`);
  div.append(head);
  const stream = { source, div, ended: false };
  streams.set(key, stream);
  stick(() => into.append(div));
  source.addEventListener("end", () => {
    source.close();
    stream.ended = true;
    head.textContent = kind === "model" ? "streamed" : head.textContent.replace(/^running/, "ran");
  });
  if (kind === "call") {
    let raw = "";
    const out = el("pre", "output");
    div.append(out);
    source.onmessage = (m) => {
      raw += JSON.parse(m.data);
      stick(() => { out.textContent = screen(raw); out.scrollTop = out.scrollHeight; });
    };
    return;
  }
  const blocks = [];
  source.onmessage = (m) => {
    const e = JSON.parse(JSON.parse(m.data));
    stick(() => {
      if (e.type === "content_block_start") {
        const b = e.content_block;
        const block = el("div", `block ${b.type === "text" ? "" : b.type === "thinking" ? "thinking" : "tool"}`);
        block.textContent = b.type === "tool_use" ? `→ ${b.name} ` : "";
        blocks[e.index] = block;
        div.append(block);
      } else if (e.type === "content_block_delta" && blocks[e.index]) {
        const d = e.delta;
        blocks[e.index].textContent += d.text ?? d.thinking ?? d.partial_json ?? "";
      }
    });
  };
}

// A context is a value named by its head, so it is fetched once per head.
async function loadContext(head, into) {
  const res = await fetch(`/context/${head}`);
  if (!res.ok || shownHead !== head) return;
  const chain = await res.json();
  stick(() => {
    into.replaceChildren();
    for (const e of chain) into.append(entry(e, e.id === head));
    for (const [key, s] of streams) if (s.ended) { s.div.remove(); streams.delete(key); }
  });
  toBottom = false;
}

function entry(e, isHead) {
  const div = el("div", `entry ${e.role}${isHead ? " head" : ""}`);
  div.append(el("div", "role", e.missing ? "entry not stored" : e.role));
  if (e.role === "root") {
    div.append(el("div", "block", e.model));
    const sys = el("details");
    sys.append(el("summary", null, "system prompt and tools"), el("pre", null, json(e.system)), el("pre", null, json(e.tools)));
    div.append(sys);
    return div;
  }
  if (e.content == null) return div;
  let content;
  try { content = JSON.parse(e.content); } catch { content = e.content; }
  if (typeof content === "string") content = [{ type: "text", text: content }];
  for (const b of content) {
    if (b.type === "text") div.append(el("div", "block", b.text));
    else if (b.type === "thinking") div.append(el("div", "block thinking", b.thinking));
    else if (b.type === "tool_use") {
      const input = JSON.stringify(b.input);
      const use = el("details", "block tool");
      use.append(el("summary", null, `→ ${b.name}${gist(input)}`), el("pre", null, fields(b.input)));
      div.append(use);
    }
    else if (b.type === "tool_result") {
      const c = typeof b.content === "string" ? b.content : (b.content || []).map((x) => x.text || "").join("\n");
      div.append(el("div", "block tool", `← ${c}`));
    } else div.append(el("div", "block tool", JSON.stringify(b)));
  }
  return div;
}

// A tool's input as its fields, each string as it reads.
const fields = (input) => Object.entries(input || {}).map(([k, v]) => `${k}: ${typeof v === "string" && v.includes("\n") ? "\n" + v : JSON.stringify(v)}`).join("\n");
const json = (s) => { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } };
const preview = (s) => { try { const v = JSON.parse(s); return v.question || s; } catch { return s; } };

function addFacts(list) {
  const ul = $("#facts ul");
  for (const f of list) {
    const li = el("li");
    li.append(el("span", "seq", `${f.seq} `), el("span", "at", `${clock(f.at)} `), el("span", f.by, f.text));
    ul.prepend(li);
  }
  while (ul.children.length > 300) ul.lastChild.remove();
}

// The stream's event id is the journal position: the browser resends it on
// reconnect and gets every record after it.
const source = new EventSource("/events");
source.onopen = () => { $("#link").textContent = "live"; $("#link").className = "meta"; };
source.onerror = () => { $("#link").textContent = "reconnecting"; $("#link").className = "meta down"; };
source.onmessage = (m) => {
  const data = JSON.parse(m.data);
  view = data.view;
  addFacts(data.facts);
  render();
};

// Throbbers move and waits grow between events.
let frame = 0;
setInterval(() => {
  frame = (frame + 1) % FRAMES.length;
  for (const s of document.querySelectorAll("[data-spin]")) s.textContent = FRAMES[frame];
}, 100);
setInterval(render, 1000);
</script>
</body>
</html>
