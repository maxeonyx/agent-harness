<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>harness</title>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css">
<style>
  :root {
    --ground: #f0eee6; --paper: #faf9f5; --white: #fffefb; --line: #e3dfd3; --ink: #141413;
    --muted: #6b6a64; --faint: #a19f96; --maroon: #7a1f22; --maroon-soft: #f3e3e1; --hover: #e9e5d9;
    --green: #4f8a55; --red: #b3352c;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, ui-serif, serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--ground); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; gap: .35em; padding: .3em .75em; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.armed { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  [hidden] { display: none !important; }
  .icon { display: inline-grid; place-items: center; width: 2.15em; height: 2.15em; border-radius: 50%; color: var(--muted); flex: none; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon svg { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* What floats over the map: usage at the left, fit and new at the right. */
  #bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: .9em;
    padding: .55em .9em max(.55em, env(safe-area-inset-bottom)); pointer-events: none; color: var(--muted); font-size: 12.5px;
  }
  #bottom > * { pointer-events: auto; }
  body.covered #bottom { display: none; }
  .spacer { flex: 1; pointer-events: none !important; }
  #bottom .icon { background: rgba(250, 249, 245, .88); backdrop-filter: blur(6px); border: 1px solid var(--line); }
  #bottom #new { width: 2.7em; height: 2.7em; background: var(--ink); border-color: var(--ink); color: var(--paper); }
  #usage { display: inline-flex; gap: 1.1em; align-items: center; }
  .gauge { display: inline-flex; gap: .4em; align-items: center; }
  .gauge i { display: inline-block; width: 3.4em; height: .32em; border-radius: 1em; background: var(--line); overflow: hidden; }
  .gauge i b { display: block; height: 100%; background: var(--muted); }
  .gauge.high i b { background: var(--maroon); }
  .alarm { color: var(--maroon); font-weight: 600; }
  /* Shown only while the brain is out of reach, and only once it has been a moment. */
  #link { position: fixed; top: max(.6em, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 40; display: none; padding: .2em .8em; border-radius: 999px; background: var(--maroon); color: var(--paper); font-size: 12.5px; pointer-events: none; }
  #link.down { display: block; animation: late 1.5s steps(1, end) both; }
  #link.down::after { content: "reconnecting"; }
  @keyframes late { from { opacity: 0; } to { opacity: 1; } }

  /* The map: an endless dotted ground, the world on it. */
  #map { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
    background-color: var(--ground);
    background-image: radial-gradient(circle, rgba(20, 20, 19, .10) 1px, transparent 1.3px); }
  #map.grabbing { cursor: grabbing; }
  #map.grabbing #panel { user-select: none; -webkit-user-select: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #nodes { user-select: none; -webkit-user-select: none; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #empty { position: fixed; inset: 0; display: grid; place-content: center; color: var(--faint); font: 16px var(--serif); pointer-events: none; }

  path.edge { fill: none; stroke: rgba(20, 20, 19, .32); stroke-width: 1.5; }
  path.edge.receives { stroke-dasharray: 5 5; }
  path.edge.continues { stroke-dasharray: 1.5 4.5; stroke-linecap: round; stroke: rgba(20, 20, 19, .28); }
  path.edge.flow { stroke: rgba(20, 20, 19, .62); stroke-dasharray: 2 7; stroke-linecap: round; stroke-width: 2; animation: flow .9s linear infinite; }
  path.edge.flow.max { stroke: var(--maroon); }
  @keyframes flow { to { stroke-dashoffset: 18; } }

  /* A node: a dot and its name. Its colour and motion say what it is doing;
     the words are on hover. */
  .node {
    position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center;
    text-decoration: none; color: inherit; text-align: center; transition: opacity .25s;
  }
  .node .dot {
    position: relative; width: var(--d); height: var(--d); border-radius: 50%; display: grid; place-items: center;
    background: var(--paper); border: 1.5px solid var(--ink); font: 600 calc(var(--d) * .44) / 1 var(--serif);
    transition: transform .2s var(--ease), background .3s, border-color .3s, color .3s;
  }
  .node:hover .dot { transform: scale(1.1); }
  .node .name { margin-top: 5px; font: 600 13.5px/1.2 var(--serif); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.root .name { font-size: 15.5px; }
  .node .ring { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; pointer-events: none; }
  .node.working .ring { border-top-color: var(--ink); border-right-color: rgba(20, 20, 19, .25); animation: spin 1.5s linear infinite; }
  .node.streaming .ring { animation-duration: .7s; }
  .node.tool .ring { border: 2px dashed rgba(20, 20, 19, .55); animation: spin 4s linear infinite; }
  .node.children .ring { border-color: rgba(20, 20, 19, .16); }
  .node.starting .dot { border-style: dashed; color: var(--faint); }
  .node.starting .ring { border: 2px dotted rgba(20, 20, 19, .3); animation: spin 6s linear infinite; }
  .node.listening .dot { border-style: double; border-width: 3px; }
  .node.needs .dot { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .node.needs .name { color: var(--maroon); }
  .node.next .ring { border-color: var(--maroon); animation: halo 2.2s var(--ease) infinite; }
  .node.paused .dot { background: var(--ground); border-color: var(--faint); color: var(--muted); }
  .node.paused .name { color: var(--muted); }
  .node.trouble .ring { border: 2px dashed var(--red); animation: spin 3s linear infinite; }
  .node.cancelling .ring { border: 2px dashed var(--faint); animation: spin 5s linear infinite; }
  .node.done { opacity: .5; }
  .node.done:hover { opacity: .9; }
  .node.done .dot { background: var(--green); border-color: var(--green); color: var(--paper); }
  .node.done .name { font-weight: 500; }
  .node.failed .dot { background: var(--red); border-color: var(--red); }
  .node.cancelled .dot { background: var(--line); border-color: var(--faint); color: var(--muted); border-radius: 30%; }
  .node.unmatched { opacity: .12 !important; }
  .node.selected { visibility: hidden; }
  .node .more { margin-top: 3px; font-size: 11px; color: var(--muted); border-radius: 9px; padding: 0 .5em; }
  /* A finished project, folded: a small card on the archive shelf. */
  .node.archived { align-items: flex-start; text-align: left; justify-content: center; height: 34px; padding: 0 1.7em 0 .75em; border: 1px solid var(--line); border-radius: 10px; background: rgba(250, 249, 245, .7); opacity: 1; }
  .node.archived::before { content: ""; position: absolute; left: -4px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--green); opacity: .6; }
  .node.archived.failed::before { background: var(--red); }
  .node.archived:hover { background: var(--paper); }
  .node.archived .dot { display: none; }
  .node.archived .name { margin: 0; font: 500 13px/1.2 var(--serif); color: var(--muted); }
  .node.archived .more { position: absolute; right: .25em; top: 50%; transform: translateY(-50%); margin: 0; }
  .node.scope { pointer-events: none; }
  .node.scope .dot { --d: 9px; background: var(--ink); border: 0; }
  .node.scope.background .dot { background: var(--paper); border: 1.5px solid var(--ink); }
  .node.scope.settled .dot { background: var(--green); opacity: .6; }
  .node.sat .dot { font: 600 11px/1 var(--sans); border-style: dashed; }
  .node.sat .name { font: 12px/1.2 var(--sans); color: var(--muted); font-weight: 400; }
  .node.sat.ask .dot { background: var(--maroon); border-color: var(--maroon); color: var(--paper); border-style: solid; }
  .node.sat.ask .name { color: var(--maroon); font-weight: 600; }
  .node.enter { animation: grow .45s var(--ease); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes halo { 0% { transform: scale(1); opacity: .7; } 70% { transform: scale(1.55); opacity: 0; } 100% { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .35; } }
  @keyframes grow { from { transform: scale(.2); opacity: 0; } }

  /* What needs Max but is off screen: a mark at the edge, toward it. */
  .offscreen { position: fixed; z-index: 25; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--maroon); color: var(--paper); display: grid; place-items: center; box-shadow: 0 3px 10px rgba(122, 31, 34, .35); }
  .offscreen svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .offscreen.next::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--maroon); animation: halo 2.2s var(--ease) infinite; }

  /* The words for what is hovered. */
  #tip { position: fixed; z-index: 50; max-width: 21em; background: var(--white); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(40, 30, 20, .14); padding: .5em .75em .55em; font-size: 12.5px; color: var(--muted); pointer-events: none; }
  #tip b { display: block; color: var(--ink); font: 600 14px/1.3 var(--serif); }
  #tip .now { color: var(--ink); }
  #tip .m { margin-top: .3em; color: var(--faint); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  #find { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 40; width: min(26em, calc(100vw - 2em)); font: 15px var(--sans); padding: .5em 1em; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--ink); box-shadow: 0 8px 26px rgba(40, 30, 20, .14); outline: 0; }

  /* An open node: a card in the map where the node is. */
  #panel {
    position: absolute; left: 0; top: 0; z-index: 2; display: flex; flex-direction: column; background: var(--paper);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 22px 60px rgba(40, 30, 20, .2); overflow: hidden;
    cursor: auto; touch-action: auto; will-change: transform;
  }
  #panel > .bar { display: flex; align-items: center; gap: .55em; padding: .5em .6em .5em 1em; border-bottom: 1px solid var(--line); min-height: 2.9em; cursor: grab; }
  .bar .mini { position: relative; width: .85em; height: .85em; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; background: var(--paper); }
  .bar .mini::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid transparent; }
  .bar .mini.working::after { border-top-color: var(--ink); animation: spin 1.2s linear infinite; }
  .bar .mini.tool::after { border: 1.5px dashed rgba(20, 20, 19, .5); animation: spin 4s linear infinite; }
  .bar .mini.starting { border-style: dashed; }
  .bar .mini.needs { background: var(--maroon); border-color: var(--maroon); }
  .bar .mini.paused { border-color: var(--faint); background: var(--ground); }
  .bar .mini.done { background: var(--green); border-color: var(--green); }
  .bar .mini.failed { background: var(--red); border-color: var(--red); }
  .bar .mini.cancelled { background: var(--line); border-color: var(--faint); border-radius: 30%; }
  .bar .title { flex: 1; min-width: 0; font: 600 16.5px/1.3 var(--serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .bar .title[contenteditable] { cursor: text; outline: 0; border-bottom: 1px solid var(--ink); text-overflow: clip; }
  .bar .ctx { display: grid; align-items: center; width: 3.6em; height: 1.6em; padding: 0 .35em; border-radius: 6px; }
  .bar .ctx:hover { background: var(--hover); }
  .bar .ctx i { display: block; height: .3em; border-radius: 1em; background: var(--line); overflow: hidden; }
  .bar .ctx b { display: block; height: 100%; background: var(--muted); }
  .bar .ctx.high b { background: var(--maroon); }
  .bar .x { font-size: 20px; line-height: 1; width: 1.5em; height: 1.5em; border-radius: 8px; color: var(--muted); }
  .bar .x:hover { background: var(--hover); color: var(--ink); }
  #panel > .mix { border-bottom: 1px solid var(--line); padding: .7em 1.1em .8em; font-size: 12.5px; color: var(--muted); }
  .mix .stack { display: flex; height: .55em; border-radius: 1em; overflow: hidden; background: var(--line); margin: .45em 0 .6em; max-width: 40em; }
  .mix .stack b { display: block; height: 100%; }
  .mix table { border-collapse: collapse; margin-bottom: .6em; }
  .mix td { padding: .05em 1.2em .05em 0; }
  .mix td.n { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .mix i { display: inline-block; width: .7em; height: .7em; border-radius: 2px; margin-right: .45em; vertical-align: -.05em; }
  .mix .btn { font-size: 12.5px; padding: .15em .7em; }
  #panel > .body { flex: 1; display: flex; min-height: 0; }
  #panel.fresh > .body { display: none; }
  .scroll { flex: 1; overflow: auto; overscroll-behavior: contain; scroll-padding-bottom: 2em; touch-action: pan-y; }
  .log { max-width: 48rem; margin: 0 auto; padding: 1.4em 1.6em 2.5em; }
  .viewer { flex: 1; min-width: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--white); }
  .viewer header { display: flex; align-items: center; gap: .6em; padding: .5em .8em; border-bottom: 1px solid var(--line); font-size: 13px; }
  .viewer header .path { font-family: var(--mono); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer header .x { font-size: 20px; line-height: 1; padding: .1em .35em; border-radius: 8px; color: var(--muted); }
  .viewer .content { flex: 1; overflow: auto; padding: 1em 1.4em; }
  .viewer iframe { width: 100%; height: 100%; border: 0; background: white; }
  .viewer .content.frame { padding: 0; }
  .jump { position: sticky; bottom: .8em; margin: 0 auto; display: block; width: max-content; box-shadow: 0 6px 18px rgba(40, 30, 20, .15); }

  /* The log reads like Claude Desktop's chat, and is the exact context. */
  .entry { margin: 0 0 1.1em; }
  .prose { font: 16px/1.62 var(--serif); overflow-wrap: anywhere; }
  .prose.entry { position: relative; }
  .prose .copy { position: absolute; right: 0; bottom: -1.4em; font: 12px var(--sans); color: var(--muted); background: none; border: 0; cursor: pointer; opacity: 0; }
  .prose:hover .copy, .prose .copy:focus { opacity: 1; }
  @media (hover: none) { .prose .copy { opacity: .6; } }
  .prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose pre, .prose blockquote, .prose table { margin: .65em 0; }
  .prose h1, .prose h2, .prose h3, .prose h4 { font-family: var(--serif); line-height: 1.25; margin: 1.1em 0 .45em; }
  .prose h1 { font-size: 1.35em; } .prose h2 { font-size: 1.2em; } .prose h3 { font-size: 1.07em; }
  .prose code { font: .86em var(--mono); background: rgba(20, 20, 19, .055); padding: .1em .3em; border-radius: 4px; }
  .prose pre { background: #f3f1ea; border: 1px solid var(--line); border-radius: 8px; padding: .7em .9em; overflow: auto; }
  .prose pre code, .prose pre code.hljs { background: none; padding: 0; font-size: 12.5px; line-height: 1.5; }
  .prose .diagram { margin: .65em 0; overflow: auto; text-align: center; }
  .prose blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 1em; color: var(--muted); }
  .prose table { border-collapse: collapse; font-size: .92em; display: block; overflow: auto; }
  .prose th, .prose td { border: 1px solid var(--line); padding: .3em .6em; text-align: left; }
  .prose a { color: var(--maroon); }
  .prose img { max-width: 100%; }
  .plain { white-space: pre-wrap; }
  .said { display: flex; flex-direction: column; align-items: flex-end; }
  .said .bubble { max-width: 85%; background: #e9e5da; border-radius: 16px 16px 4px 16px; padding: .6em 1em; font: 15px/1.55 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
  .said.queued-words .bubble { background: transparent; border: 1.5px dashed var(--faint); }
  .said.answer .bubble { border-left: 3px solid var(--maroon); }
  .said.prompt .bubble { font-weight: 600; padding: .45em 1em; }
  .said .then { max-width: 85%; margin: .3em .3em 0 0; font-size: 12px; color: var(--faint); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .said .then.full { white-space: pre-wrap; text-align: left; }
  .card { border: 1px solid var(--line); border-radius: 12px; background: var(--white); padding: .75em 1em; }
  .card .label { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: .35em; display: flex; gap: .6em; align-items: baseline; }
  .card.mandate { background: transparent; }
  .card.mandate .prose { font-size: 15px; }
  .card.clip .prose { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .more-link { font-size: 12.5px; color: var(--maroon); margin-top: .3em; cursor: pointer; }
  details > summary.more-link { margin: .1em 0 .3em 1em; }
  .card.ask { border-color: var(--maroon); background: var(--maroon-soft); }
  .card.result { border-color: #c9c4b4; }
  .card.ended { border-color: var(--red); color: var(--red); }
  .note { display: flex; gap: .5em; font-size: 12.5px; color: var(--faint); margin: .2em 0 1em; }
  .note::before { content: "⚙"; }
  .note .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; min-width: 0; }
  .note .t.full { white-space: pre-wrap; color: var(--muted); }
  .meta { font-size: 11.5px; color: var(--faint); margin: -.5em 0 1.1em; opacity: 0; transition: opacity .15s; }
  .chunk:hover .meta, .row:hover > .meta { opacity: 1; }
  .thought { font-size: 13px; color: var(--muted); margin: 0 0 .7em; }
  .thought summary { cursor: pointer; list-style: none; }
  .thought summary::before { content: "◌ "; }
  .thought .plain { font-style: italic; margin: .3em 0 0 1.1em; }
  .steps { margin: 0 0 1.1em; border-left: 2px solid var(--line); padding-left: .2em; }
  .steps > .head { font-size: 12.5px; color: var(--muted); padding: .1em .5em .3em; cursor: pointer; }
  .steps > .head:hover { color: var(--ink); }
  .steps.folded > .row:not(:last-child):not(.asks) { display: none; }
  .row { margin: 0 0 .15em; }
  .row > .line { display: flex; align-items: baseline; gap: .55em; padding: .22em .5em; border-radius: 7px; cursor: pointer; font-size: 13.5px; min-width: 0; }
  .row > .line:hover { background: var(--hover); }
  .row .tool { font: 600 12px var(--mono); color: var(--ink); }
  .row .gist { font: 12.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .row .st { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .row .st.bad { color: var(--red); }
  .row .st.run::before { content: ""; display: inline-block; width: .7em; height: .7em; border: 1.5px solid var(--ink); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -.05em; margin-right: .3em; }
  .row .open-file { font-size: 12px; color: var(--maroon); }
  .row > .meta { margin: 0 0 .3em .5em; }
  .row > .detail { margin: .2em 0 .6em 1em; }
  .row:not(.expanded) > .detail { display: none; }
  .row > .card.ask { margin: .3em 0 .6em; }
  .io { font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f1ea; border: 1px solid var(--line); border-radius: 8px; padding: .55em .75em; margin: .3em 0; max-height: 28em; overflow: auto; }
  .io.err { border-color: var(--red); }
  .io .k { color: var(--muted); }
  .rendered { border: 1px solid var(--line); border-radius: 8px; padding: .7em 1em; background: var(--white); margin: .3em 0; max-height: 34em; overflow: auto; }
  .rendered img { max-width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: .4em; margin: .25em 0 .5em 1em; }

</style>

<script>
"use strict";
// ─── Small things ──────────────────────────────────────────────────────────
const $ = (s, root = document) => root.querySelector(s);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const svgEl = (tag) => document.createElementNS("http://www.w3.org/2000/svg", tag);
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : s < 86400 ? `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m` : `${Math.floor(s / 86400)}d`;
};
const kTokens = (n) => n == null ? "?" : n < 1000 ? `${n}` : n < 1e6 ? `${(n / 1000).toFixed(n < 10000 ? 1 : 0)}k` : `${+(n / 1e6).toFixed(1)}M`;
const parse = (s) => { try { return JSON.parse(s); } catch { return undefined; } };
const phone = () => matchMedia("(max-width: 760px)").matches;
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const lerp = (a, b, e) => a + (b - a) * e;
// Icons, drawn in the colour of the text around them.
const ICONS = {
  mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>',
  send: '<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>',
  stop: '<rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor" stroke="none"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  toward: '<path d="M9 5l7 7-7 7"/>',
};
function icon(name, cls, title) {
  const b = el("button", `icon ${cls || ""}`);
  b.type = "button";
  b.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
  if (title) { b.title = title; b.setAttribute("aria-label", title); }
  return b;
}

// The gist of a call's input: its command, or the path or pattern it names.
function gist(input) {
  const v = typeof input === "string" ? parse(input) : input;
  const s = v && (v.command ?? v.path ?? v.pattern ?? v.question ?? v.query ?? v.url ?? v.name ?? v.tool);
  if (typeof s !== "string") return "";
  const line = s.split("\n")[0];
  return line.length > 90 ? line.slice(0, 90) + "…" : line;
}

function markdown(text) {
  if (!window.marked || !window.DOMPurify) return el("div", "plain", text);
  const div = el("div", "prose");
  div.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: false }));
  for (const a of div.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
  // Code in the colours of its language, when it names one; a diagram drawn.
  for (const code of div.querySelectorAll("pre > code")) {
    const lang = [...code.classList].find((c) => c.startsWith("language-"))?.slice(9);
    if (lang === "mermaid") diagram(code.parentElement, code.textContent);
    else if (lang && window.hljs?.getLanguage(lang)) hljs.highlightElement(code);
  }
  return div;
}
// A mermaid diagram where its source was. The library loads the first time
// one is shown; a source it cannot draw stays as written.
let mermaidLib = null, diagrams = 0;
async function diagram(pre, source) {
  try {
    mermaidLib ||= import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs")
      .then((m) => { m.default.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" }); return m.default; });
    const { svg } = await (await mermaidLib).render(`mermaid-${++diagrams}`, source);
    const fig = el("div", "diagram");
    fig.innerHTML = DOMPurify.sanitize(svg, { USE_PROFILES: { svg: true, svgFilters: true, html: true } });
    pre.replaceWith(fig);
  } catch { /* stays as its source */ }
}

// ─── This tab: a place on the substrate ────────────────────────────────────
// The tab is the wasm build of harness-face-tab: its own records, kept in
// IndexedDB until the brain's standing covers them, and its replica of the
// rows the brain derives for it. This script is glue: the DOM, the link and
// IndexedDB. Whatever the tab says is parsed into core's facts by the wasm,
// stored, and only then shipped; what became of it is read off the tab's
// standing in a later view, so a refusal shows here, where it was made.
let can = { act: false, dictation: false, sample: false };
fetch("/wiring").then((r) => r.json()).then((c) => { can = c; render(); });

const enc = new TextEncoder(), dec = new TextDecoder();
let wasm = null;
// One call into the tab: `input` (a string or bytes) in its I/O buffer,
// the export's JSON output back.
function tabCall(name, input, ...args) {
  if (input !== undefined) {
    const bytes = typeof input === "string" ? enc.encode(input) : input;
    const at = wasm.io(bytes.length);
    new Uint8Array(wasm.memory.buffer, at, bytes.length).set(bytes);
  }
  const ret = wasm[name](...args);
  const out = new Uint8Array(wasm.memory.buffer, wasm.io_ptr(), wasm.io_len());
  return { ret, out: out.length ? JSON.parse(dec.decode(out)) : null };
}
// What names a value in the facts: its digest, as the core computes it.
const digest = (text) => tabCall("digest", text).out;

// IndexedDB: every place's records this browser holds, by time.
const db = new Promise((ok, fail) => {
  const open = indexedDB.open("harness-tabs", 1);
  open.onupgradeneeded = () => open.result.createObjectStore("records", { keyPath: "at" }).createIndex("place", "place");
  open.onsuccess = () => ok(open.result);
  open.onerror = () => fail(open.error);
});
const done = (tx) => new Promise((ok, fail) => { tx.oncomplete = ok; tx.onerror = tx.onabort = () => fail(tx.error); });
async function loadPlace(place) {
  const store = (await db).transaction("records").objectStore("records");
  const req = store.index("place").getAll(place);
  return new Promise((ok, fail) => { req.onsuccess = () => ok(req.result.map((r) => r.record)); req.onerror = () => fail(req.error); });
}
async function placesHeld() {
  const req = (await db).transaction("records").objectStore("records").index("place").getAllKeys();
  const keys = await new Promise((ok, fail) => { req.onsuccess = () => ok(req.result); req.onerror = () => fail(req.error); });
  return [...new Set(keys.map((at) => at.split(".")[0]))];
}
async function forget(place) {
  const tx = (await db).transaction("records", "readwrite");
  const store = tx.objectStore("records");
  for (const at of await new Promise((ok) => { const r = store.index("place").getAllKeys(place); r.onsuccess = () => ok(r.result); })) store.delete(at);
  await done(tx);
}

// A place: a tab's handle in the wasm and its link to the brain.
class Place {
  constructor(id, handle, onView) { this.id = id; this.h = handle; this.onView = onView; this.ws = null; this.waiting = []; this.flushing = Promise.resolve(); }
  static async open(id, onView) {
    const { ret, out } = tabCall("open", JSON.stringify({ place: id, records: await loadPlace(id) }));
    if (ret === 0xffffffff) throw new Error(out.error);
    return new Place(id, ret, onView);
  }
  // Make the tab's writes durable, in order.
  persist() {
    const writes = tabCall("writes", undefined, this.h).out;
    if (!writes.length) return this.flushing;
    this.flushing = this.flushing.then(async () => {
      const tx = (await db).transaction("records", "readwrite");
      const store = tx.objectStore("records");
      for (const w of writes) {
        if (w.Put) store.put({ at: w.Put.at, place: this.id, record: w.Put });
        else store.delete(w.Drop);
      }
      await done(tx);
    });
    return this.flushing;
  }
  connect() {
    const ws = this.ws = new WebSocket(`wss://${location.host}/link?place=${this.id}`);
    ws.onopen = () => this.shipUnsent();
    ws.onmessage = (m) => {
      const { out } = tabCall("down", m.data, this.h);
      if (out.error) return console.error(out.error);
      if (out.live) return liveArrived(out.live.live);
      const fresh = m.data.startsWith('{"View"');
      this.persist();
      this.waiting = this.waiting.filter((w) => {
        const s = this.status(w.n);
        if (s === "pending") return true;
        w.ok(s === "included" ? null : s.refused);
        return false;
      });
      this.onView?.(fresh);
    };
    ws.onclose = () => { if (this.ws === ws) { this.onView?.(null); setTimeout(() => this.connect(), 1000); } };
  }
  close() { const ws = this.ws; this.ws = null; ws?.close(); tabCall("close", undefined, this.h); }
  shipUnsent() {
    const { out } = tabCall("unsent", undefined, this.h);
    if (out.restored) return restored(this);
    for (const up of out.ups) this.ws?.send(JSON.stringify(up));
  }
  status(n) { return tabCall("status", undefined, this.h, n).out; }
  view() { return tabCall("view", undefined, this.h).out; }
  next() { return tabCall("next", undefined, this.h).out; }
  records() { return tabCall("records", undefined, this.h).out; }
  settled() { return wasm.settled(this.h) === 1; }

  // includes it, or with why it refused it; until then it is pending.
  async say(batch) {
    const { out } = tabCall("say", JSON.stringify(batch), this.h, Date.now());
    if (out.error) return out.error;
    await this.persist();
    if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify(out.up));
    return new Promise((ok) => this.waiting.push({ n: out.n, ok }));

}

// This tab's place: kept in sessionStorage across reloads, and held by a
// Web Lock, so a duplicated tab (which copies sessionStorage) becomes a
// place of its own. A place is per tab per brain: IndexedDB is per origin.
const mintPlace = () => [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join("");
function hold(id) {
  return new Promise((ok) => navigator.locks.request(`place:${id}`, { ifAvailable: true }, (lock) => {
    ok(!!lock);
    return lock ? new Promise(() => {}) : null;
  }));
}
let tab = null;
async function boot() {
  wasm = (await WebAssembly.instantiateStreaming(fetch("/tab.wasm"))).instance.exports;
  let id = sessionStorage.getItem("place");
  if (!id || !(await hold(id))) { do id = mintPlace(); while (!(await hold(id))); }
  sessionStorage.setItem("place", id);
  tab = await Place.open(id, viewArrived);
  restoreLocal();
  tab.connect();
  adoptOrphans();
}
// A closed tab's place, whose lock is free: ship what it had not, then
// forget it, so nothing typed in a tab that was closed offline is lost.
async function adoptOrphans() {
  for (const id of await placesHeld()) {
    if (id === tab.id || !(await hold(id))) continue;
    const orphan = await Place.open(id, () => {
      if (!orphan.settled()) return;
      orphan.close();
      forget(id);
    });
    orphan.connect();
  }
}
// The brain holds more of this place than this browser does: its storage
// was restored or lost. It goes on as a new place.
async function restored(place) {
  if (place !== tab) { place.close(); return forget(place.id); }
  tab.close();
  await forget(tab.id);
  let id; do id = mintPlace(); while (!(await hold(id)));
  sessionStorage.setItem("place", id);
  tab = await Place.open(id, viewArrived);
  tab.connect();
}

// Max's facts, in one record at this tab. `facts` may be a function of the
// record's time, `place.n`, which names what the record creates
// (`${at}.0`). Values are the texts the facts name. Resolves with null once
// included, or the brain's reason for refusing it.
async function act(facts, values = []) {
  if (!tab) return "this tab has not started";
  const at = tab.next();
  const made = typeof facts === "function" ? facts(at) : facts;
  return tab.say({ values, facts: Array.isArray(made) ? made : [made] });
}

// ─── The model: the view as a map ──────────────────────────────────────────
// A node is a task. A scope (the spawn call that owns its members) is a
// junction under its owner. Background work a task will hear back from
// hangs off it. Projects are the map's disconnected components.
//
// Edges: solid, a scope and its members (owned, settled together); dashed,
// a result that will arrive without anyone waiting for it now (background
// work); dotted, a task continued by a resume; flowing,
// waited on right now.
let view = null;
let byId = {};
let graph = { nodes: new Map(), edges: [], comps: [] };
// A chat of Max's he continued after it finished is one node: its newest
// resume, whose context holds all of it. Each earlier one maps to it.
let alias = {};
const live = (id) => alias[id] || id;

// What a task is doing, as the map shows it: classes for its dot, and the
// words its hover says.
function look(t) {
  const w = t.waiting || {};
  const since = w.since != null ? ` · ${ago(w.since)}` : "";
  const stopping = t.stop && w.kind !== "done" ? " cancelling" : "";
  switch (w.kind) {
    case "model": return { cls: (w.streaming ? "working streaming" : "working") + stopping, text: (stopping ? "cancelling: " : "") + (w.streaming ? "writing" : "thinking") + since };
    case "calls": {
      const kids = w.calls.flatMap((c) => c.children);
      if (kids.length) {
        const running = kids.filter((k) => byId[k] && byId[k].waiting?.kind !== "done").length;
        return { cls: "children" + stopping, text: `waiting on ${running} of ${kids.length}${since}` };
      }
      const c = w.calls[0] || {};
      return { cls: "working tool" + stopping, text: `${c.tool || "tools"}${c.input ? " " + gist(c.input) : ""}` };
    }
    case "max": return { cls: "needs" + stopping, text: (w.ask ? "asks you" : "your turn") + since };
    case "starting": return { cls: "starting", text: w.limbs.length ? `making ${w.limbs.join(", ")}` : "starting" };
    case "harness": return { cls: "working" + stopping, text: "harness" + since };
    case "held": { const h = heldBy(t); return { cls: "paused", text: h && h !== t ? `paused with ${h.name}` : "paused" }; }
    case "limited": return { cls: "paused", text: `limited until ${clock(w.until)}` };
    case "listening": {
      const asks = (t.background || []).filter((b) => b.limb === "max").length;
      return { cls: "listening" + stopping, text: asks ? "asks you, carrying on" : w.calls.length ? `${w.calls.length} in the background` : "listening" };
    }
    case "done": {
      const o = t.outcome || {};
      if (o.kind === "failed") return { cls: "done failed", text: `failed ${ago(w.since)} ago` };
      if (o.kind === "cancelled") return { cls: "done cancelled", text: `cancelled ${ago(w.since)} ago` };
      return { cls: "done", text: `done ${ago(w.since)} ago` };
    }
  }
  return { cls: "", text: w.kind || "" };
}
// Under its owner, a task's name without the owner's name it starts with.
const shortName = (t) => { const o = byId[parentOf(t)]; return o && t.name.startsWith(o.name + "-") ? t.name.slice(o.name.length + 1) : t.name; };
const glyph = (t) => (t.environment || t.name || "?").trim()[0].toUpperCase();
// Tasks in the order they were created.
const order = (a, b) => a.created.seq - b.created.seq;
const isDone = (t) => t.waiting?.kind === "done";
// A resume Max made of one of his own chats: the same chat, continued.
const chained = (t) => t.origin === "resume" && !t.owner && byId[t.from] && !byId[t.from].owner;
// Who a task belongs to on the map: its scope's owner, or the task a resume
// in Max's own scope continues.
const parentOf = (t) => t.owner ? live(t.owner) : t.from && byId[t.from] && !chained(t) ? live(t.from) : null;
const ancestry = (t) => { const out = []; for (let p = parentOf(t); p && byId[p] && out.length < 50; p = parentOf(byId[p])) out.unshift(byId[p]); return out; };
// What pauses a task: itself, or the nearest paused task above it.
const heldBy = (t) => t.held ? t : ancestry(t).reverse().find((a) => a.held) || null;
// The calls a task is waiting on right now.
function awaited(t) {
  const w = t?.waiting || {};
  return new Set([...(w.calls || []).map((c) => c.id), ...(w.ask ? [w.ask.id] : [])]);
}

// A finished project folds to its root once it has been finished a while:
// a small card on the archive shelf, below everything live.

  title.focus();
  getSelection().selectAllChildren(title);

title.addEventListener("keydown", (e) => {

async function endRename(keep) {
  const t = byId[openId], name = title.textContent.trim();

  if (!t || !keep || !name || name === t.name) { title.textContent = t?.name || ""; return; }
  const why = await act({ Task: [t.id, { Renamed: name }] });

// How full a task's context was at its last request, of its model's window.
const fullness = (t) => t.tokens && t.window ? Math.min(1, t.tokens.context / t.window) : 0;

// What a context holds: its last request's token count, split by what each
// part of the context is, in proportion to its size (an estimate: the
// provider counts only the whole).
const MIX = [
  ["system", "System prompt", "#141413"], ["tools", "Tool definitions", "#6b6a64"],
  ["mandate", "Mandate and brief", "#a19f96"], ["max", "Your words", "#7a1f22"],
  ["notes", "Harness notes", "#c9c4b4"], ["said", "Its words", "#4f6d8a"],
  ["calls", "Its tool calls", "#8aa1b8"], ["results", "Tool results", "#6c8f5e"],
];
function mixOf(chain) {
  const m = Object.fromEntries(MIX.map(([k]) => [k, 0]));
  const size = (b) => b.type === "image" ? 6000 : JSON.stringify(b).length;
  for (const e of chain) {
    if (e.role === "root") { m.system += (e.system || "").length; m.tools += (e.tools || "").length; continue; }
    blocksOf(e).forEach((b, k) => {
      const who = e.role === "user" ? (e.by || [])[k]?.by || "harness" : null;
      const into = b.type === "tool_result" ? "results" : b.type === "tool_use" ? "calls"
        : b.type === "thinking" || b.type === "redacted_thinking" ? null
        : e.role === "assistant" ? "said" : who === "max" || who === "answer" || who === "prompt" ? "max"
        : who === "mandate" || who === "brief" ? "mandate" : "notes";
      if (into) m[into] += size(b);
    });
  }
  return m;
}
async function renderMix(t) {
  const box = $(".mix", panel);
  const key = `${t.id}:${t.head}:${t.tokens?.context}:${logState?.exact}`;
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  const chain = t.head ? await contextOf(t.head) : null;
  if (!chain || box.dataset.key !== key) return;
  const m = mixOf(chain), total = Object.values(m).reduce((a, b) => a + b, 0) || 1, tokens = t.tokens?.context || 0;
  const stack = el("div", "stack"), table = el("table");
  for (const [k, label, colour] of MIX) {
    if (!m[k]) continue;
    const b = el("b"); b.style.width = `${(m[k] / total) * 100}%`; b.style.background = colour; b.title = label; stack.append(b);
    const sw = el("i"); sw.style.background = colour;
    const tr = el("tr"), name = el("td"); name.append(sw, label);
    tr.append(name, el("td", "n", `≈${kTokens(Math.round(tokens * m[k] / total))}`), el("td", "n", `${Math.round(m[k] / total * 100)}%`));
    table.append(tr);

  const head = el("div", null, `${kTokens(tokens)} of ${kTokens(t.window)} (${Math.round(fullness(t) * 100)}%) at its last request · ${t.tokens?.output ?? "?"} out`);
  const exact = el("button", `btn${logState?.exact ? " armed" : ""}`, "As sent");
  exact.type = "button";
  exact.title = "The log as the exact context the model was sent";
  exact.onclick = () => {
    const id = logState.id, on = !logState.exact;
    logState = { id, head: undefined, rendered: [], rows: new Map(), group: null, exact: on, follow: true };
    logEl.classList.toggle("exact", on);
    logEl.replaceChildren();
    renderPanel();
  };

}
$(".ctx", panel).onclick = () => { const m = $(".mix", panel); m.hidden = !m.hidden; m.dataset.key = ""; if (!m.hidden && byId[openId]) renderMix(byId[openId]); };

// What Max can do to the task itself, quietly under the box: pause it and
// what is under it, cancel it and what it started, and, in a chat, say it
// is done. A cancel asks once more; a second while it tidies up ends it now.
function renderControls(t) {
  const row = $(".acts", compose);
  if (!row) return;
  const holder = heldBy(t);
  const key = `${t.id}:${isDone(t)}:${holder?.id}:${t.mode}:${!!t.stop}:${t.stop?.hard}:${can.act}`;
  if (row.dataset.key === key) return;
  row.dataset.key = key;
  row.replaceChildren();
  if (!can.act || isDone(t)) return;
  const action = (label, tip, fact, confirm) => {
    const b = el("button", null, label);
    b.type = "button";
    b.title = tip;
    b.onclick = async () => {
      if (confirm && !b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = `${label}?`; setTimeout(() => { b.classList.remove("armed"); b.textContent = label; }, 4000); return; }
      b.classList.remove("armed"); b.textContent = label;
      const why = await act(fact);
      if (why) say(`${label}: ${why}`, true);
    };
    row.append(b);
  };
  if (holder) action("Resume", holder === t ? "It and everything under it carry on" : `Paused with ${holder.name}: it and everything under it carry on`, () => ({ Task: [holder.id, { Held: false }] }));
  else action("Pause", "It and everything under it finish what is running, then wait", () => ({ Task: [t.id, { Held: true }] }));
  if (!t.stop) action("Cancel", "It and everything it started stop, tidy up and report", () => ({ Task: [t.id, { Drain: { Stop: { by: "Max", within: 120000 } } }] }), true);
  else if (!t.stop.hard) action("Cancel now", "End it and everything it started now, with no tidy-up", () => ({ Task: [t.id, { Drain: { Stop: { by: "Max", within: 0 } } }] }), true);
  if (t.mode === "user-facing") action("Done", "It writes its result and finishes", (at) => ({ Delivery: { id: `${at}.0`, to: t.id, content: { Prompt: "Done" } } }));
}

// A task Max starts from what he wrote: its mandate his words, what he
// attached delivered with them. A new chat, a finished chat continued, or
// an aside: a fork of a task waiting on agents it started, to talk with
// while they work, as one more of them. What the record creates is named
// by its time and the fact that creates it; `how` may make facts of its
// own first (a new chat's limbs), and `after` rides along.
async function start(how, text, files, after = []) {
  const mandate = digest(text), words = files.length ? JSON.stringify(files.map((a) => a.block)) : null;
  let id;
  const why = await act((at) => {
    const out = [], next = () => `${at}.${out.length}`;
    const h = typeof how === "function" ? how(next, out) : how;
    id = next();
    out.push({ Task: [id, { Created: {
      name: h.name, by: null, scope: h.scope, origin: h.origin,
      mode: "UserFacing", mandate: { text: mandate, brief: null, quotes: [] },
    } }] });
    if (words) out.push({ Delivery: { id: next(), to: id, content: { Words: digest(words) }, read: "Next" } });
    return [...out, ...after];
  }, words ? [text, words] : [text]);

}
const aside = (t, text, files, after) => start({ name: `${t.name}-aside`, scope: { Spawn: t.scoped }, origin: { Aside: { from: t.id } } }, text, files, after);
const resume = (t, text, files) => start({ name: t.name, scope: "Max", origin: { Resume: { from: t.id } } }, text, files);

// ─── The log: the context, exactly as sent, rendered ──────────────────────
const contexts = new Map();
async function contextOf(head) {
  if (!contexts.has(head)) contexts.set(head, fetch(`/context/${head}`).then((r) => r.ok ? r.json() : null).catch(() => null));
  return contexts.get(head);
}

async function renderLog(t) {
  const s = logState;
  if (!s || s.id !== t.id) return;
  if (s.head !== t.head) {
    const head = t.head;
    s.head = head;
    const chain = head ? await contextOf(head) : [];
    if (logState !== s || s.head !== head) return;
    if (!chain) return;
    stick(() => appendChain(s, chain, t));
  }
  stick(() => renderTail(s, t));
}

// New entries append; an entry no longer in the chain (a rewind, a new root)
// starts the log again.
function appendChain(s, chain, t) {
  const ids = chain.map((e) => e.id);
  const keep = s.rendered.findIndex((r, i) => r.id !== ids[i]);
  if (keep !== -1 || s.rendered.length > ids.length) {
    s.rendered = []; s.rows = new Map(); s.group = null; s.prevText = null;
    logEl.replaceChildren();
  }
  for (let i = s.rendered.length; i < chain.length; i++) {
    const e = chain[i];
    const into = el("div", "chunk");
    into.dataset.entry = e.id;
    if (s.exact) exactEntry(into, e);
    else entry(s, into, e, i, t);
    s.rendered.push({ id: e.id, el: into });
    const tail = $(".tail", logEl);
    if (tail) tail.before(into); else logEl.append(into);
  }
}

function exactEntry(into, e) {
  const div = el("div", `exact-entry ${e.role}`);
  div.append(el("div", "who", e.role === "root" ? `root · ${e.model}` : e.role));
  if (e.role === "root") div.append(el("div", "io", e.system || ""), el("div", "io", e.tools || ""));
  else { const c = parse(e.content); div.append(el("div", "io", c === undefined ? e.content : JSON.stringify(c, null, 2))); }
  into.append(div);
}

function blocksOf(e) {
  let c = parse(e.content);
  if (c === undefined) c = e.content;
  if (typeof c === "string") c = [{ type: "text", text: c }];
  return Array.isArray(c) ? c : [];
}

function entry(s, into, e, index, t) {
  if (e.role === "root") {
    const d = el("details", "thought");
    const tools = (parse(e.tools) || []).map((x) => x.name);
    d.append(el("summary", null, `${e.model} · system prompt and ${tools.length} tools`));
    d.append(el("div", "io", e.system || ""), el("div", "io", JSON.stringify(parse(e.tools), null, 2) || ""));
    into.append(d);
    return;
  }
  const blocks = blocksOf(e);
  // What the harness sent: each block as whoever wrote it, by the face's
  // account of the request that sent it. Max's words are his bubbles; the
  // harness's labels for them are not shown.
  if (e.role === "user") {
    const by = e.by || [];
    let run = null; // Max's bubble or the mandate's card a block continues
    blocks.forEach((b, k) => {
      const who = by[k] || { by: "harness" };
      if (run && run.by !== who.by) run = null;
      if (b.type === "tool_result") { result(s, b); return; }
      closeGroup(s);
      if (b.type === "image") { const img = el("img"); img.src = `data:${b.source?.media_type};base64,${b.source?.data}`; img.style.maxWidth = "100%"; into.append(img); return; }
      if (b.type !== "text" || who.by === "label") return;
      const text = b.text || "";
      if (who.by === "max") {
        // A mandate sent before its framing had a block of its own carries it.
        const words = text.replace(/^\[harness\][^\n]*:\n\n/, "");
        if (run) { $(".bubble", run.el).textContent += `\n${words}`; return; }
        run = { by: "max", el: said(words, clock(who.at)) };
        into.append(run.el);
      } else if (who.by === "prompt") {
        into.append(prompted(who.prompt, text));
      } else if (who.by === "answer") {
        into.append(said(who.said, "while it carried on", "answer"));
      } else if (who.by === "brief" || who.by === "mandate") {
        if (!run) {
          run = { by: who.by, el: el("div", "entry card mandate") };
          run.el.title = who.by === "brief" ? "The brief its spawn shares" : `From ${byId[t.owner]?.name || "its owner"}`;
          into.append(run.el);
        }
        run.el.append(markdown(text));
        if (text.length > 900 && !$(".more-link", run.el)) {
          const card = run.el, m = el("button", "more-link", "Show all");
          card.classList.add("clip");
          m.onclick = () => { card.classList.toggle("clip"); m.textContent = card.classList.contains("clip") ? "Show all" : "Show less"; };
          card.after(m);
        }
      } else into.append(note(text));
    });
    return;
  }
  // The assistant's turn: its words read as prose; its tool uses as steps.
  for (const b of joined(blocks)) {
    if (b.type === "thinking" || b.type === "redacted_thinking") {
      if (!b.thinking) continue;
      const d = el("details", "thought"); d.append(el("summary", null, "Thinking"), el("div", "plain", b.thinking));
      (s.group ? s.group.el : into).append(d);
    } else if (b.type === "text") {
      closeGroup(s);
      const p = markdown(b.text || "");
      p.classList.add("entry");
      for (const a of p.querySelectorAll('a[title^="cite: "]')) { a.className = "cite"; a.title = a.title.slice(6); }
      const copy = el("button", "copy", "Copy"); copy.title = "Copy as markdown";
      copy.onclick = () => navigator.clipboard.writeText(b.text || "").then(() => { copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy"; }, 1200); });
      p.append(copy);
      into.append(p);
    } else if (b.type === "tool_use" || b.type === "server_tool_use") {
      step(s, into, b, t);
    } else if (b.type === "web_search_tool_result" || b.type === "web_fetch_tool_result") {
      served(s, b);
    }
  }
  const r = e.response;
  if (r && r.ended) {
    const meta = el("div", "meta", `${clock(r.ended)} · ${((r.ended - r.sent) / 1000).toFixed(1)}s · ${kTokens(r.context)} context · ${kTokens(r.output)} out`);
    // A turn of only tools keeps its timing on its last step, so a folded group shows one.
    (s.group ? s.group.rows[s.group.rows.length - 1] : into).append(meta);
  }
}

// Words in a bubble on the right: Max's, or what his user is to an agent.
// When and how they were sent is on hover.
function said(text, when, cls = "") {
  const d = el("div", `entry said ${cls}`);
  const words = parse(text);
  const body = Array.isArray(words) ? words.map((w) => w.type === "image" ? "[image]" : w.text || "").join("\n") : text;
  const bubble = el("div", "bubble", body);
  if (when) bubble.title = when;
  d.append(bubble);
  return d;
}
// A standard prompt, as the act it is: Max's Done; a cancel, his or the
// agent's owner's. The harness's instruction is a line under it, in full
// when clicked. Other standard prompts are the harness's notes.
const PROMPTS = { Done: "Done", Stopping: "Cancel" };
function prompted(prompt, text) {
  if (!PROMPTS[prompt]) return note(text);
  const d = said(PROMPTS[prompt], null, "prompt");
  const then = el("div", "then", text.replace(/^\[harness\] /, ""));
  then.onclick = () => then.classList.toggle("full");
  d.append(then);
  return d;
}
function note(text) {
  const n = el("div", "note"), tx = el("span", "t", text.replace(/^\[harness\] /, ""));
  tx.onclick = () => tx.classList.toggle("full");
  n.append(tx);
  return n;
}

// Consecutive tool steps with no words between them fold into one group,
// which shows its latest step until opened.
function step(s, into, b, t) {
  if (!s.group) {
    const g = el("div", "steps folded");
    const head = el("div", "head");
    const group = { el: g, head, rows: [], opened: false };
    head.onclick = () => { group.opened = g.classList.contains("folded"); groupHead(group); };
    g.append(head);
    s.group = group;
    into.append(g);
  }
  const row = toolRow(s, b, t);
  s.group.el.append(row);
  s.group.rows.push(row);
  groupHead(s.group);
}
function groupHead(g) {
  const n = g.rows.length;
  g.head.hidden = n < 3;
  g.el.classList.toggle("folded", n >= 3 && !g.opened);
  if (n < 3) return;
  const counts = {};
  for (const r of g.rows) counts[r.dataset.tool] = (counts[r.dataset.tool] || 0) + 1;
  const what = Object.entries(counts).map(([k, v]) => v > 1 ? `${k} ×${v}` : k).join(", ");
  g.head.textContent = `${g.el.classList.contains("folded") ? "▸" : "▾"} ${n} steps · ${what}`;
}
function closeGroup(s) { s.group = null; }

const FILES = /\.(md|markdown|svg|html?|txt|json|rs|py|js|ts|toml|ya?ml|sh|css)$/i;
function toolRow(s, b, t) {
  const row = el("div", "row");
  row.dataset.tool = b.name;
  const line = el("div", "line");
  const input = b.input || {};
  const inner = b.name === "background" ? input.input || {} : input;
  const name = b.name === "background" ? `${input.tool} ↷` : b.name;
  line.append(el("span", "tool", name), el("span", "gist", gist(inner)), el("span", "st run", ""));
  const detail = el("div", "detail");
  detail.append(el("div", "io", fields(input)));
  row.append(line, detail);
  line.onclick = () => row.classList.toggle("expanded");
  const path = inner.path;
  if (path && FILES.test(path) && (b.name === "write" || input.tool === "write")) {
    const open = el("button", "open-file", "open"); open.onclick = (e) => { e.stopPropagation(); viewFile(path, inner.content); };
    line.insertBefore(open, line.lastChild);
  }
  // What a spawn or add_sibling started, beside it: each opens where it is
  // on the map.
  if (b.name === "spawn" || b.name === "add_sibling" || (b.name === "background" && input.tool === "spawn")) {
    const chips = el("div", "chips");
    row.insertBefore(chips, detail);
    row.chips = chips;
  }
  if (b.name === "ask" || (b.name === "background" && input.tool === "ask")) {
    const q = el("div", "card ask");
    q.append(markdown(inner.question || JSON.stringify(inner)));
    row.classList.add("asks");
    row.insertBefore(q, detail);
  }
  if (b.name === "handover") {
    const q = el("div", "card");
    q.append(el("div", "label", "Handed over to a fresh context"), markdown(input.note || ""));

// What the provider's web search or fetch found, in the row of its use.
function served(s, b) {

  if (!r) return;
  const c = b.content, failed = c && !Array.isArray(c) && c.error_code;
  const st = $(".st", r.row);
  st.className = `st${failed ? " bad" : ""}`;
  st.textContent = failed ? "failed" : "✓";
  const found = Array.isArray(c) ? c.filter((x) => x.url) : c?.url ? [{ url: c.url, title: c.content?.title }] : [];
  const out = el("div", "io found");
  if (failed) out.textContent = c.error_code;
  for (const x of found) {
    const a = el("a", null, x.title || x.url);
    a.href = x.url; a.target = "_blank"; a.rel = "noopener";
    const li = el("div"); li.append(a, el("span", "host", ` ${new URL(x.url).host}${x.page_age ? ` · ${x.page_age}` : ""}`)); out.append(li);

// Consecutive text blocks read as one passage: a cited answer comes as
// many small blocks, each cited one followed by links to its sources.
function joined(blocks) {
  const out = [];
  for (const b of blocks) {
    if (b.type !== "text") { out.push(b); continue; }
    const urls = [...new Set((b.citations || []).map((c) => c.url).filter(Boolean))];
    const text = (b.text || "") + urls.map((u) => {
      const title = (b.citations.find((c) => c.url === u)?.title || u).replace(/["\\]/g, "");
      return ` [${new URL(u).host.replace(/^www\./, "")}](${u} "cite: ${title}")`;

function fillChips(s, toolUse) {

function chip(m) {

// A tool use's result, shown in its row.
function result(s, b) {

  const text = typeof b.content === "string" ? b.content : (b.content || []).map((x) => x.type === "text" ? x.text : `[${x.type}]`).join("\n");
  st.className = `st${b.is_error ? " bad" : ""}`;
  st.textContent = b.is_error ? "failed" : "✓";

  const out = el("div", `io${b.is_error ? " err" : ""}`, text);
  const path = r.inner.path;
  if (r.b.name === "read" && path && /\.(md|markdown|svg|html?)$/i.test(path) && !b.is_error) {
    const raw = text.split("\n").map((l) => l.replace(/^\s*\d+[\t│|:] ?/, "")).join("\n");
    const open = el("button", "open-file", "open");
    open.onclick = (e) => { e.stopPropagation(); viewFile(path, raw); };
    $(".line", r.row).insertBefore(open, st);

  if (r.b.name === "spawn") {
    const card = el("div", "card result");
    card.append(markdown(text));
    const d = el("details"); d.append(el("summary", "more-link", "Their results"), card);
    r.row.insertBefore(d, detail);

  for (const x of Array.isArray(b.content) ? b.content : []) if (x.type === "image") { const img = el("img"); img.src = `data:${x.source?.media_type};base64,${x.source?.data}`; img.style.maxWidth = "100%"; detail.append(img); }

}
// A tool's input as its fields, each string as it reads.
const fields = (input) => Object.entries(input || {}).map(([k, v]) => `${k}: ${typeof v === "string" && v.includes("\n") ? "\n" + v : typeof v === "string" ? v : JSON.stringify(v, null, 2)}`).join("\n");

// A file an agent wrote or read, shown as itself beside the log.
function viewFile(path, content) {
  const v = $(".viewer", panel);
  v.hidden = false;
  const head = el("header");

// What is not in the context yet: what is streaming now, what Max sent that

function mandateCard(t) {

// The task's outstanding question to Max: mid-turn, or in the background.
function askOf(t) {

// The log keeps to its bottom while Max is there, so live text scrolls into

function stick(change) {

}
scrollEl.addEventListener("scroll", () => { if (scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 80) $(".jump", panel).hidden = true; });
$(".jump", panel).onclick = () => { scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: "smooth" }); };

// A request streaming, or a command printing: neither is a fact. Each

  const prose = el("div", "prose live-text");
  holder.append(prose);
  let text = "", pendingDraw = null;
  modelStream = { call, holder };
  watch(`Model:${call}`, (t) => {
    text = t;
    if (pendingDraw) return;
    pendingDraw = setTimeout(() => {
      pendingDraw = null;

    }, 80);

}
function stopModel() { if (modelStream) { watchers.delete(`Model:${modelStream.call}`); modelStream = null; } }
function followCall(c, row) {
  if (callStreams.has(c.id)) return;
  const out = el("div", "io");
  $(".detail", row).append(out);
  row.classList.add("expanded");
  callStreams.add(c.id);
  watch(`Call:${c.id}`, (raw) => stick(() => { out.textContent = screen(raw); out.scrollTop = out.scrollHeight; }));
}

// A command's output as a terminal would leave it: only the last lines.
function screen(raw) {
  const lines = raw.replace(/\r\n/g, "\n").split("\n").map((l) => l.slice(l.lastIndexOf("\r") + 1));
  return (lines.length > 300 ? [`[${lines.length - 300} earlier lines]`, ...lines.slice(-300)] : lines).join("\n");
}

// ─── What Max writes ───────────────────────────────────────────────────────
// One box per open node: a staging area, its text and attachments kept per

// model until Max sends it, one of two ways: now (Ctrl+Enter), read with the
// task's next request even mid-turn, or at the end of its turn

const compose = $(".compose", panel);
let box = null, dictation = null;

  if (Array.isArray(said)) return {
    text: said.filter((b) => b.type === "text").map((b) => b.text).join("\n\n"),

async function save(session) {

  const c = local.get(id);

  const value = JSON.stringify({ text: c.text, attached: c.attached });
  const empty = !c.text && !c.attached.length;
  if (id.startsWith("new:") && empty) return local.delete(id);
  let raced = null;
  const why = await act((at) => {
    raced = `${at}.0`;
    c.n = Number(at.split(".")[1]);
    c.saved = c.v;
    if (!id.startsWith("new:")) return { Draft: [id, empty ? "Discarded" : { Text: digest(value) }] };

    id = `${at}.0`;
    local.set(id, c);
    bound.set(session, id);
    return [{ Draft: [id, { Opened: { session } }] }, { Draft: [id, { Text: digest(value) }] }];
  }, empty ? [] : [value]);

  // now, and this box goes on with them.

// Forget what this tab typed once the brain holds it: then the draft's row
// is the truth, whichever device typed last.
function settleLocal() {

function restoreLocal() {

    const n = Number(r.at.split(".")[1]);

// A chat not started yet, and its fields, have no session; nor has the
// continuing of a finished chat, whose words start the session that takes
// them. Theirs are kept in this tab.
const unborn = (key) => key === NEW || key.startsWith("new:") || isDone(byId[key]);
const keptHere = (key) => ({ text: "", attached: [], ...parse(sessionStorage.getItem(`draft:${key}`) || "{}") });
const keepHere = (key, change) => sessionStorage.setItem(`draft:${key}`, JSON.stringify({ ...keptHere(key), ...change }));
const drafts = {
  get: (session) => unborn(session) ? keptHere(session).text : contentOf(draftOf(session) || `new:${session}`).text,
  set: (session, text) => unborn(session) ? keepHere(session, { text }) : edit(session, { text }),

function syncCompose() {

  const text = drafts.get(box.dataset.key);

// The session's other drafts: words held when the session could not take

  const session = box.dataset.key, mine = draftOf(session);
  others.replaceChildren(...rowsOf(session).filter((d) => d.id !== mine).map((d) => {
    const c = contentOf(d.id), card = el("div", `other${d.held ? " held" : ""}`);
    card.append(el("span", "said", c.text.split("\n")[0].slice(0, 160) || `${c.attached.length} attached`));
    card.append(el("span", "why", d.held ? `not heard: ${d.held}` : !d.from ? "another draft" : rowsOf(session).some((o) => o.id === d.from) ? "typed at the same time as another" : "typed after another was sent"));

const IMAGES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
async function attach(key, files) {
  const list = attached.get(key);
  for (const f of files) {
    if (IMAGES.includes(f.type)) {
      const data = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(f); });
      list.push({ name: f.name || "pasted image", block: { type: "image", source: { type: "base64", media_type: f.type, data } } });
    } else {
      list.push({ name: f.name, block: { type: "text", text: `[${f.name}]\n\n${await f.text()}` } });
    }
  }
  const why = attached.set(key, list);
  if (why) say(`not attached: ${why}`, true);
  renderTray();
}
function renderTray() {
  const tray = $(".tray", compose);
  if (!tray || !box) return;
  const key = box.dataset.key;
  tray.replaceChildren(...attached.get(key).map((a, i) => {
    const chip = el("span", "att");
    if (a.block.type === "image") { const img = el("img"); img.src = `data:${a.block.source.media_type};base64,${a.block.source.data}`; chip.append(img); }
    const x = el("button", null, "×"); x.type = "button"; x.title = "Remove";
    x.onclick = () => { const list = attached.get(key); list.splice(i, 1); attached.set(key, list); renderTray(); };
    chip.append(el("span", null, a.name), x);

  }));
}

function buildCompose(id) {
  compose.replaceChildren();
  box = null;
  const t = byId[id];
  if (id !== NEW && !t) return;
  if (!can.act) { compose.append(el("div", "closed", "This face only watches.")); return; }
  const wrap = el("div", "box");
  const tray = el("div", "tray");
  box = el("textarea");
  box.rows = id === NEW ? 2 : 1;
  box.dataset.key = id;
  box.spellcheck = true;
  box.value = drafts.get(id);
  const row = el("div", "row2");
  const mic = icon("mic", "mic", "Dictate"); mic.hidden = !can.dictation;
  const sample = el("button", "later sample", "Dictate the sample"); sample.type = "button"; sample.hidden = !can.sample;
  const picks = el("span", "picks");
  const status = el("span", "status");
  const later = el("button", "later after", "After this turn"); later.type = "button";
  later.title = "It reads this when its turn ends, without cutting across its work (Ctrl+Shift+Enter)";
  const halt = icon("stop", "halt", "Interrupt: it stops at the next safe point, and waits for you");
  const send = icon("send", "send", "Send (Ctrl+Enter)");
  row.append(mic, sample, picks, status, later, halt, send);
  wrap.append(el("div", "others"), tray, box, row);
  compose.append(wrap, el("div", "acts"));

  box.addEventListener("paste", (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); attach(id, fs); } });

  wrap.addEventListener("drop", (e) => { e.preventDefault(); wrap.classList.remove("drop"); attach(id, [...e.dataTransfer.files]); });

  sample.onclick = () => dictate(true);

// Mid-turn, words can go now or wait for the turn's end; between turns, in
// response to its question, or to a finished chat, there is only now.
const midTurn = (t) => ["model", "calls", "harness", "held", "limited"].includes(t.waiting?.kind);
// Working on its own, not waiting on agents it started: what an interrupt stops.
const working = (t) => !t.scoped && !!t.turn && (["model", "harness"].includes(t.waiting?.kind) || (t.waiting?.kind === "calls" && !t.waiting.calls.some((c) => c.children.length)));
function renderComposeState(t) {
  if (!box) return;
  const key = box.dataset.key, has = !!box.value.trim() || attached.get(key).length > 0;
  $(".send", compose).disabled = !has;
  if (key === NEW) {
    box.placeholder = "New chat";
    $(".after", compose).hidden = true;
    $(".halt", compose).hidden = true;
    return;
  }
  if (!t || key !== t.id) return;
  const ask = askOf(t), mid = midTurn(t) && !ask && !isDone(t);
  box.placeholder = isDone(t) ? "Continue this chat" : ask ? "Respond" : "Reply";
  $(".after", compose).hidden = !(mid && has);

// Only what went wrong is said; what went right shows as itself.
const say = (text, bad) => { const s = $(".status", compose); if (s) { s.textContent = bad ? text : ""; s.title = text; s.className = `status${bad ? " bad" : ""}`; } };

// Sending: to a task working or between turns, the draft's Send; to its

async function submit(read) {

  const ask = askOf(t);

  // A new task whose mandate is these words; the draft goes with them.
  if (isDone(t) || (t.scoped && !ask && read === "Next")) {
    if (!text.trim()) return say("write something to go with what is attached", true);
    const why = isDone(t) ? await resume(t, text, files) : await aside(t, text, files, draft ? [{ Draft: [draft, "Discarded"] }] : []);
    if (why) return say(`not sent: ${why}`, true);

    renderTray();

  const words = JSON.stringify(blocks), id = digest(words);
  let sent = null;
  const why = await act((at) => {
    sent = `${at}.0`;
    if (ask) return [{ Call: [ask.id, { Settled: { Completed: { model: id, full: null, observes: [] } } }] }, ...(draft ? [{ Draft: [draft, "Discarded"] }] : [])];
    const facts = [];
    if (!draft) { draft = sent; facts.push({ Draft: [draft, { Opened: { session: t.id } }] }); }

  const successor = !ask && rows.find((d) => d.id === sent && d.from === draft);

  for (const e of [...edits].reverse()) {
    if (e.at >= l.P) { const from = l.start + e.at - l.P; target.setRangeText(e.put, from, from + e.cut, "preserve"); }
    else if (e.at + e.cut <= l.P) l.P += e.put.length - e.cut;
    else { target.setRangeText(e.put, l.start, l.start + e.at + e.cut - l.P, "preserve"); l.P = e.at; }
    l.T = l.T.slice(0, e.at) + e.put + l.T.slice(e.at + e.cut);
  }
  if (following) target.setSelectionRange(end(), end());
  drafts.set(l.key, target.value);
  if (shown) { prev = box.value; autosize(); renderComposeState(byId[l.key]); }
}

// The microphone as 16-bit PCM, in chunks of a tenth of a second.
const WORKLET = URL.createObjectURL(new Blob([`
registerProcessor("pcm", class extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(sampleRate / 10); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(sampleRate / 10); this.n = 0;
      }
    }
    return true;
  }
});`], { type: "application/javascript" }));

async function dictate(sample) {
  if (dictation) return stopDictation();
  if (!box) return;
  let rate = 16000, mic = null;
  try {
    if (!sample) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new AudioContext();
      await ctx.audioWorklet.addModule(WORKLET);
      const node = new AudioWorkletNode(ctx, "pcm");
      ctx.createMediaStreamSource(stream).connect(node);
      rate = ctx.sampleRate;
      mic = { stream, ctx, node };
    }
  } catch (e) { return say(`no microphone: ${e.message}`, true); }
  // Dictation goes in at the caret, a space from the word before it.
  let at = box.selectionEnd;
  if (at > 0 && !/\s/.test(box.value[at - 1])) { box.setRangeText(" ", at, at, "end"); at += 1; prev = box.value; }
  const ws = new WebSocket(`wss://${location.host}/dictation?rate=${rate}${sample ? "&sample" : ""}`);
  ws.binaryType = "arraybuffer";
  dictation = { ws, mic, key: box.dataset.key, T: "", P: 0, start: at };
  if (mic) mic.node.port.onmessage = (m) => { if (ws.readyState === 1) ws.send(m.data); };
  const b = $(".mic", compose); if (b) { b.classList.add("on"); b.title = "Stop dictating"; }
  say("connecting");
  const l = dictation;
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.listening) say(sample ? "dictating the sample" : "listening");
    if (d.edits && dictation === l) applyEdits(d.edits);
    if (d.error) say(d.error, true);
    if (d.final) finishDictation(l);
  };
  ws.onclose = () => finishDictation(l);
  box.focus();
}
function releaseMic(l) {
  if (!l.mic) return;
  l.mic.stream.getTracks().forEach((t) => t.stop());
  l.mic.ctx.close();
  l.mic = null;
}
function stopDictation() {
  if (!dictation) return;
  releaseMic(dictation);
  if (dictation.ws.readyState === 1) dictation.ws.send(JSON.stringify({ type: "stop" }));
  say("finishing");
}
function finishDictation(l) {
  if (dictation !== l) return;
  releaseMic(l);
  dictation = null;
  l.ws.close();
  const b = $(".mic", compose); if (b) { b.classList.remove("on"); b.title = "Dictate"; }
  if (!$(".status", compose)?.classList.contains("bad")) say("");
}

// ─── A new chat, in Max's own scope ───────────────────────────────────────
// A double click on the ground, or +, opens a small card there on a chat
// that does not exist yet: the same staging box as every chat, its role and
// directory beside the send, its draft and attachments kept like theirs.
// Sending starts it: the words are its mandate, what is attached reaches it
// with them, and the card becomes the chat where it is.
function buildNew() {
  title.textContent = "New chat";
  title.title = "";
  mini.className = "mini starting";
  $(".ctx", panel).hidden = true;
  const picks = $(".picks", compose);
  if (!picks) return;
  const role = el("select", "pick"); role.id = "n-role"; role.title = "Its role";
  role.append(...view.environments.map((e) => Object.assign(el("option", null, e.name), { value: e.name })));
  role.value = drafts.get("new:role") || (view.environments.some((e) => e.name === "chat") ? "chat" : view.environments[0]?.name);
  role.hidden = view.environments.length < 2;
  const dir = el("input", "pick"); dir.id = "n-dir"; dir.placeholder = "directory"; dir.title = "Where it works";
  dir.value = drafts.get("new:dir");
  dir.setAttribute("list", "n-dirs");
  const dirs = el("datalist"); dirs.id = "n-dirs";
  dirs.append(...view.workspaces.map((w) => Object.assign(el("option"), { value: w.dir })));
  const needs = () => { dir.hidden = !view.environments.find((e) => e.name === role.value)?.places.length; };
  role.onchange = () => { drafts.set("new:role", role.value); needs(); };
  dir.oninput = () => drafts.set("new:dir", dir.value);
  needs();
  picks.replaceChildren(role, dir, dirs);
}
// A name from the first words of a mandate, to its first clause's end.
const nameFrom = (text) => {
  const words = text.trim().split(/[\n.,;:!?]/)[0].split(/\s+/).slice(0, 6).join(" ");
  return words.length > 40 ? `${words.slice(0, 39)}…` : words;
};
async function startNew(text, files) {
  const env = view.environments.find((e) => e.name === $("#n-role").value);
  const dir = $("#n-dir").value.trim();
  if (!env) return say("choose a role", true);
  if (env.places.length && !dir) return say(`it needs a directory for its ${env.places[0]}`, true);
  if (!text.trim()) return say("write what it is for", true);
  const why = await start((next, out) => {
    const places = {};
    for (const place of env.places) {
      const known = view.workspaces.find((w) => w.dir === dir);
      const limb = known ? known.id : next();
      if (!known) out.push({ Limb: { id: limb, name: dir, kind: { Plugin: { kind: place, config: JSON.stringify({ dir }) } } } });
      places[place] = limb;
    }
    return { name: nameFrom(text), scope: "Max", origin: { Fresh: { environment: env.id, places } } };
  }, text, files);
  if (why) return say(`not started: ${why}`, true);
  box.value = prev = "";
  drafts.set(NEW, "");
  attached.set(NEW, []);
}

// ─── Finding a chat ────────────────────────────────────────────────────────
// Ctrl+K, or /: what matches by its name or what it was for stays, the rest
// of the map fades; Enter opens the newest match, Esc lets it go.
const findEl = $("#find");
let finding = "", found = new Set();
function startFind() { findEl.hidden = false; findEl.focus(); findEl.select(); }
function endFind() { findEl.hidden = true; findEl.value = ""; finding = ""; found = new Set(); findEl.blur(); if (view) drawMap(); }
findEl.addEventListener("input", () => {
  finding = findEl.value.trim().toLowerCase();
  found = new Set();
  if (finding) {
    for (const t of view.tasks) if (`${t.name}\n${t.mandate || ""}`.toLowerCase().includes(finding)) found.add(live(t.id));
    // A folded project matches through what it folds.
    for (const c of graph.comps) if (c.folded && c.tasks.some((t) => found.has(t.id))) found.add(c.root.id);
  }
  drawMap();
});
findEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const first = [...view.tasks].sort((a, b) => b.created.seq - a.created.seq).find((t) => found.has(live(t.id)));
    endFind();
    if (first) go(first.id);
  } else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); endFind(); }
});
findEl.addEventListener("blur", () => { if (!finding) endFind(); });

addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, textarea, select, [contenteditable]");
  if (e.key === "Escape") {
    if (!$(".viewer", panel).hidden) { $(".viewer", panel).hidden = true; return; }
    if (!$(".mix", panel).hidden) { $(".mix", panel).hidden = true; return; }
    if (openId) closeNode();
    return;
  }
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); startFind(); return; }
  if (!typing && (e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !openId) fit(true);
});
// The card fits the window it is in: a phone's keyboard opening shrinks it.
addEventListener("resize", () => {
  if (openId && seam) {
    const was = cardShown;
    seam = seamFor(openId);
    const r = cardRect(seam);
    placeCard(r);
    cardShown = r;
    cam = camFor(r, was && { x: r.x + r.w / 2, y: r.y, sx: cam.x + (was.x + was.w / 2) * cam.k, sy: cam.y + was.y * cam.k });
    applyCamera();
  }
  refresh();
});

// ─── The view ──────────────────────────────────────────────────────────────
// The tab's rows, one per object, as the page draws them.
function assemble(v) {
  const out = { as_of: v.as_of, seq: Number(v.as_of.split(".")[1]), tasks: [], scopes: {}, queue: [], drafts: [], environments: [], workspaces: [] };
  for (const [key, row] of Object.entries(v.rows)) {
    const id = key.slice(key.indexOf(":") + 1);
    if (row.Task) out.tasks.push(row.Task);
    else if (row.Scope) out.scopes[id] = row.Scope;
    else if (row.Queue) out.queue = row.Queue;
    else if (row.Harness) Object.assign(out, row.Harness);
    else if (row.Draft) out.drafts.push({ id, ...row.Draft });
  }
  return out;
}
async function viewArrived(fresh) {
  if (fresh === null) { $("#link").className = "down"; $("#link").title = "reconnecting"; return; }
  $("#link").className = ""; $("#link").title = "live";
  if (fresh) liveReset();
  view = assemble(tab.view());
  settleLocal();
  await refresh();
  if (pendingOpen && byId[pendingOpen]) { const id = pendingOpen; pendingOpen = null; history.replaceState({ node: id }, "", `#${id}`); route(); }
  else if (!openId && location.hash.length > 1 && (byId[location.hash.slice(1)] || location.hash === `#${NEW}`) && !moving.started) { moving.started = true; route(); }
}
boot().catch((e) => { $("#link").className = "down"; $("#link").title = `this tab could not start: ${e}`; console.error(e); });
// Waits grow between events: the hover's words, and the open card's.
setInterval(() => { if (view) { if (tipFor) fillTip(); if (openId) renderPanel(); } }, 1000);
</script>
