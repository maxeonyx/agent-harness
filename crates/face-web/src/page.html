<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness</title>
<style>
  :root {
    --ground: #f0eee6; --paper: #faf9f5; --line: #e0dccf; --ink: #141413;
    --muted: #6b6a64; --maroon: #7a1f22; --hover: #e8e4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; gap: 1.5em; align-items: baseline; padding: .7em 1.2em;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font: 600 1.15em ui-serif, Georgia, serif; margin: 0; }
  header .meta { color: var(--muted); }
  #link.down { color: var(--maroon); font-weight: 600; }
  #refused { color: var(--maroon); font-weight: 600; }
  main {
    display: grid; gap: 1em; padding: 1em 1.2em;
    grid-template-columns: minmax(22em, 1fr) minmax(26em, 1.4fr);
    grid-template-areas: "queue detail" "tree detail" "facts compose";
    grid-template-rows: auto 1fr auto;
    height: calc(100vh - 3em);
  }
  section { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; overflow: auto; }
  section > h2 {
    font: 600 .8em ui-sans-serif, system-ui, sans-serif; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin: 0; padding: .7em 1em .3em;
  }
  #queue { grid-area: queue; } #tree { grid-area: tree; }
  #facts { grid-area: facts; max-height: 14em; } #detail { grid-area: detail; }
  #compose { grid-area: compose; display: flex; flex-direction: column; overflow: hidden; }
  #compose h2 .to { text-transform: none; letter-spacing: 0; color: var(--ink); }
  #box {
    flex: 1; min-height: 6em; margin: 0 1em; padding: .5em .6em; resize: none;
    font: inherit; color: var(--ink); background: var(--ground);
    border: 1px solid var(--line); border-radius: 6px;
  }
  #box:focus { outline: 2px solid var(--maroon); outline-offset: -1px; }
  #compose .controls { display: flex; gap: .6em; align-items: center; padding: .5em 1em .7em; }
  #compose button {
    font: inherit; padding: .25em .8em; border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper); color: var(--ink); cursor: pointer;
  }
  #compose button:hover { background: var(--hover); }
  #compose button:disabled { color: var(--muted); cursor: default; background: var(--paper); }
  #mic.on { background: var(--maroon); color: var(--paper); border-color: var(--maroon); }
  #status { color: var(--muted); flex: 1; }
  #status.bad { color: var(--maroon); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  .task { padding: .25em 1em .25em calc(1em + var(--depth) * 1.3em); cursor: pointer; }
  .task:hover { background: var(--hover); }
  .task.selected { background: var(--hover); box-shadow: inset 3px 0 var(--maroon); }
  .name { font-weight: 600; }
  .tag { color: var(--muted); font-size: .85em; margin-left: .4em; }
  .throb { display: block; color: var(--muted); font-size: .9em; }
  .throb.max, .throb.failed { color: var(--maroon); font-weight: 600; }
  .throb .spin { display: inline-block; width: 1.1em; }
  .done .name { color: var(--muted); font-weight: 500; }
  .queued { padding: .4em 1em; cursor: pointer; border-top: 1px solid var(--line); }
  .queued:first-of-type { border-top: 0; }
  .queued:hover { background: var(--hover); }
  .queued .name { color: var(--maroon); }
  .queued .why, .queued .ask { display: block; color: var(--ink); font-size: .9em; }
  .empty { color: var(--muted); padding: .2em 1em .8em; }
  #facts li { padding: .05em 1em; font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; }
  #facts .seq, #facts .at { color: var(--muted); }
  #facts .Max { color: var(--maroon); }
  #detail .body { padding: 0 1em 1em; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .2em 1em; margin: .3em 0 1em; }
  dt { color: var(--muted); } dd { margin: 0; }
  .mandate { white-space: pre-wrap; }
  .entry { border-top: 1px solid var(--line); padding: .6em 0; }
  .entry .role { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .entry.assistant .role { color: var(--maroon); }
  .entry.head { box-shadow: inset 3px 0 var(--maroon); padding-left: .7em; }
  .block { white-space: pre-wrap; margin: .25em 0; }
  .block.tool { font: 12px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace; background: var(--ground); padding: .3em .5em; border-radius: 4px; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; margin: .3em 0; }
</style>
</head>
<body>
<header>
  <h1>harness</h1>
  <span class="meta" id="build"></span>
  <span class="meta" id="seq"></span>
  <span class="meta" id="link">connecting</span>
  <span id="refused"></span>
</header>
<main>
  <section id="queue"><h2>Waiting on you</h2><ul></ul></section>
  <section id="tree"><h2>Tasks</h2><ul></ul></section>
  <section id="facts"><h2>Journal</h2><ul></ul></section>
  <section id="detail"><h2>Task</h2><div class="body"><p class="empty">Select a task.</p></div></section>
  <section id="compose">
    <h2>To <span class="to" id="to">no task selected</span></h2>
    <textarea id="box" placeholder="Write, paste or dictate. Enter is a new line; Ctrl+Enter sends." spellcheck="true"></textarea>
    <div class="controls">
      <button id="mic" hidden>Dictate</button>
      <button id="sample" hidden>Dictate the sample</button>
      <span id="status"></span>
      <button id="send">Send</button>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour12: false });
const ago = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
};
const FRAMES = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏";

let view = null;
let selected = location.hash.slice(1) || null;
let shownHead = null;
const facts = [];

// What the task waits on: a glyph, words, and since when.
function throbber(t) {
  const w = t.waiting;
  if (!w) return { cls: "", spin: "", text: "" };
  const since = w.since != null ? ` · ${ago(w.since)}` : "";
  switch (w.kind) {
    case "model":
      return { cls: "model", spin: true, text: (w.streaming ? "model streaming" : "model, before the first byte") + since };
    case "calls": {
      const kids = w.calls.flatMap((c) => c.children);
      if (kids.length) {
        const live = kids.filter((k) => byId[k] && byId[k].waiting && byId[k].waiting.kind !== "done").length;
        return { cls: "children", spin: true, text: `${live} of ${kids.length} children running${since}` };
      }
      const tools = w.calls.map((c) => `${c.tool}${c.status === "made" ? " (queued)" : ""}`).join(", ");
      return { cls: "tool", spin: true, text: `tool: ${tools}${since}` };
    }
    case "max": return { cls: "max", spin: "●", text: (w.ask ? "asked you" : "your turn") + since };
    case "harness": return { cls: "harness", spin: true, text: "harness: preparing the next request" };
    case "held": return { cls: "held", spin: "‖", text: "held" };
    case "limited": return { cls: "limited", spin: "⧗", text: `usage limit until ${clock(w.until)}` };
    case "listening": return { cls: "listening", spin: "◦", text: w.calls.length ? `listening, ${w.calls.length} background` : "listening" };
    case "done": {
      const o = t.outcome || {};
      if (o.kind === "failed") return { cls: "failed", spin: "✗", text: `failed: ${o.reason}` };
      if (o.kind === "cancelled") return { cls: "done", spin: "■", text: `cancelled by ${o.by}` };
      return { cls: "done", spin: "✓", text: "done" };
    }
  }
  return { cls: "", spin: "", text: w.kind };
}

let byId = {};

function render() {
  if (!view) return;
  byId = Object.fromEntries(view.tasks.map((t) => [t.id, t]));
  $("#build").textContent = view.build ? `build ${view.build}` : "";
  $("#seq").textContent = `seq ${view.seq}`;
  $("#refused").textContent = view.refused || "";

  // Max's queue, in the order the core derives.
  const queue = $("#queue ul");
  queue.replaceChildren();
  for (const q of view.queue) {
    const t = byId[q.task];
    const li = el("li", "queued");
    li.append(el("span", "name", t.name), el("span", "tag", `waiting ${ago(q.since)}`));
    if (q.ask) li.append(el("span", "ask", `asks: ${preview(q.ask.input)}`));
    li.append(el("span", "why", q.why ? q.why : "unranked"));
    li.onclick = () => select(q.task);
    queue.append(li);
  }
  if (!view.queue.length) queue.append(el("li", "empty", "Nothing needs you."));

  // The tree: Max's scope at the top, each task under the task that owns it,
  // an aside under the task it was opened on.
  const parent = (t) => t.owner || (t.origin === "aside" ? t.from : null);
  const kids = {};
  for (const t of view.tasks) (kids[parent(t)] ||= []).push(t);
  const tree = $("#tree ul");
  tree.replaceChildren();
  const walk = (id, depth) => {
    for (const t of kids[id] || []) {
      tree.append(row(t, depth));
      walk(t.id, depth + 1);
    }
  };
  walk(null, 0);
  if (!view.tasks.length) tree.append(el("li", "empty", "No tasks yet."));

  renderDetail();
  renderTo();
}

function row(t, depth) {
  const li = el("li", "task");
  li.style.setProperty("--depth", depth);
  if (t.id === selected) li.classList.add("selected");
  if (t.waiting && t.waiting.kind === "done") li.classList.add("done");
  li.append(el("span", "name", t.name), el("span", "tag", t.agent));
  if (t.origin !== "fresh") li.append(el("span", "tag", `${t.origin} of ${byId[t.from] ? byId[t.from].name : t.from}`));
  if (t.held) li.append(el("span", "tag", "held"));
  if (t.draining) li.append(el("span", "tag", `draining: ${t.draining}`));
  const th = throbber(t);
  const line = el("span", `throb ${th.cls}`);
  const spin = el("span", "spin", th.spin === true ? "" : th.spin);
  if (th.spin === true) spin.dataset.spin = "1";
  line.append(spin, document.createTextNode(th.text));
  li.append(line);
  li.onclick = () => select(t.id);
  return li;
}

function select(id) {
  selected = id;
  history.replaceState(null, "", `#${id}`);
  render();
}

// The compose box. Its text is Max's until he sends it, kept across
// reloads. Dictation streams into it as edits to a live region, which he can
// edit too: an edit inside the region pins the text up to the end of his
// edit, and the words still coming go after it.

const box = $("#box");
let can = { send: false, dictation: false, sample: false };
let prev = box.value = localStorage.getItem("draft") || "";
let live = null;

const say = (text, bad) => { $("#status").textContent = text; $("#status").className = bad ? "bad" : ""; };

fetch("/compose").then((r) => r.json()).then((c) => {
  can = c;
  $("#mic").hidden = !c.dictation;
  $("#sample").hidden = !c.sample;
});

function renderTo() {
  const t = selected && byId[selected];
  $("#to").textContent = t ? t.name : "no task selected";
}

// One input from Max: one contiguous change, found by trimming what is the
// same at both ends.
box.addEventListener("input", () => {
  const now = box.value;
  let x = 0;
  while (x < prev.length && x < now.length && prev[x] === now[x]) x++;
  let tail = 0;
  while (tail < prev.length - x && tail < now.length - x && prev[prev.length - 1 - tail] === now[now.length - 1 - tail]) tail++;
  const removed = prev.length - x - tail, inserted = now.length - x - tail;
  if (live) {
    const end = live.start + live.T.length - live.P;
    if (x + removed <= live.start && !(x === live.start && removed === 0 && live.T.length === live.P)) {
      live.start += inserted - removed;
    } else if (x <= end) {
      live.P = Math.min(live.T.length, live.P + Math.max(0, x + removed - live.start));
      live.start = x + inserted;
    }
  }
  prev = now;
  localStorage.setItem("draft", now);
});

// The endpoint's edits, in the transcript's own offsets, last first so the
// earlier offsets still hold.
function applyEdits(edits) {
  const l = live;
  const end = () => l.start + l.T.length - l.P;
  const following = box.selectionStart === box.selectionEnd && box.selectionEnd === end();
  for (const e of [...edits].reverse()) {
    if (e.at >= l.P) {
      const from = l.start + e.at - l.P;
      box.setRangeText(e.put, from, from + e.cut, "preserve");
    } else if (e.at + e.cut <= l.P) {
      l.P += e.put.length - e.cut;
    } else {
      box.setRangeText(e.put, l.start, l.start + e.at + e.cut - l.P, "preserve");
      l.P = e.at;
    }
    l.T = l.T.slice(0, e.at) + e.put + l.T.slice(e.at + e.cut);
  }
  // A caret at the end of the words keeps following them.
  if (following) box.setSelectionRange(end(), end());
  prev = box.value;
  localStorage.setItem("draft", prev);
}

// The microphone as 16-bit PCM, in chunks of a tenth of a second.
const WORKLET = URL.createObjectURL(new Blob([`
registerProcessor("pcm", class extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Int16Array(sampleRate / 10); this.n = 0; }
  process([input]) {
    const ch = input[0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      const s = Math.max(-1, Math.min(1, ch[i]));
      this.buf[this.n++] = s < 0 ? s * 0x8000 : s * 0x7fff;
      if (this.n === this.buf.length) {
        this.port.postMessage(this.buf.buffer, [this.buf.buffer]);
        this.buf = new Int16Array(sampleRate / 10); this.n = 0;
      }
    }
    return true;
  }
});`], { type: "application/javascript" }));

async function dictate(sample) {
  if (live) return stopDictation();
  let rate = 16000, mic = null;
  try {
    if (!sample) {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
      const ctx = new AudioContext();
      await ctx.audioWorklet.addModule(WORKLET);
      const node = new AudioWorkletNode(ctx, "pcm");
      ctx.createMediaStreamSource(stream).connect(node);
      rate = ctx.sampleRate;
      mic = { stream, ctx, node };
    }
  } catch (e) {
    return say(`no microphone: ${e.message}`, true);
  }
  // Dictation goes in at the caret, a space from the word before it.
  let at = box.selectionEnd;
  if (at > 0 && !/\s/.test(box.value[at - 1])) {
    box.setRangeText(" ", at, at, "end");
    at += 1;
    prev = box.value;
  }
  const ws = new WebSocket(`wss://${location.host}/dictation?rate=${rate}${sample ? "&sample" : ""}`);
  ws.binaryType = "arraybuffer";
  live = { ws, mic, T: "", P: 0, start: at, thenSend: false };
  if (mic) mic.node.port.onmessage = (m) => { if (ws.readyState === 1) ws.send(m.data); };
  $("#mic").classList.add("on");
  $("#mic").textContent = "Stop";
  $("#sample").disabled = true;
  say("connecting");
  const l = live;
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (d.listening) say(sample ? "dictating the sample" : "listening");
    if (d.edits && live === l) applyEdits(d.edits);
    if (d.error) say(d.error, true);
    if (d.final) finishDictation(l);
  };
  ws.onclose = () => finishDictation(l);
  box.focus();
}

function releaseMic(l) {
  if (!l.mic) return;
  l.mic.stream.getTracks().forEach((t) => t.stop());
  l.mic.ctx.close();
  l.mic = null;
}

function stopDictation() {
  if (!live) return;
  releaseMic(live);
  if (live.ws.readyState === 1) live.ws.send(JSON.stringify({ type: "stop" }));
  say("finishing");
  box.focus();
}

function finishDictation(l) {
  if (live !== l) return;
  releaseMic(l);
  live = null;
  l.ws.close();
  $("#mic").classList.remove("on");
  $("#mic").textContent = "Dictate";
  $("#sample").disabled = false;
  if ($("#status").className !== "bad") say("");
  if (l.thenSend) send();
}

async function send() {
  if (live) { live.thenSend = true; return stopDictation(); }
  const t = selected && byId[selected];
  if (!t) return say("select a task to send to", true);
  if (!box.value.trim()) return;
  if (!can.send) return say("sending is not wired to a brain yet", true);
  const text = box.value;
  say("sending");
  const res = await fetch("/send", { method: "POST", body: JSON.stringify({ to: t.id, seen: view.seq, text }) });
  if (!res.ok) return say(`not sent: ${await res.text()}`, true);
  if (box.value === text) { box.value = prev = ""; localStorage.removeItem("draft"); }
  say(`sent to ${t.name}`);
}

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
$("#send").onclick = send;
$("#mic").onclick = () => dictate(false);
$("#sample").onclick = () => dictate(true);

function renderDetail() {
  const body = $("#detail .body");
  const t = selected && byId[selected];
  if (!t) return;
  if (body.dataset.task !== t.id) {
    body.dataset.task = t.id;
    shownHead = null;
    body.replaceChildren(el("dl"), el("div", "context"));
  }
  const dl = body.querySelector("dl");
  dl.replaceChildren();
  const th = throbber(t);
  const fields = [
    ["task", t.name], ["agent", t.agent], ["mode", t.mode], ["environment", t.environment],
    ["waiting on", th.text], ["pending inputs", t.pending], ["failures in a row", t.failures],
  ];
  for (const [k, v] of fields) dl.append(el("dt", null, k), el("dd", null, String(v ?? "")));
  dl.append(el("dt", null, "mandate"), el("dd", "mandate", t.mandate));
  if (t.head !== shownHead) {
    shownHead = t.head;
    loadContext(t.head, body.querySelector(".context"));
  }
}

// A context is a value named by its head, so it is fetched once per head.
async function loadContext(head, into) {
  const res = await fetch(`/context/${head}`);
  if (!res.ok || shownHead !== head) return;
  const chain = await res.json();
  into.replaceChildren();
  for (const e of chain) into.append(entry(e, e.id === head));
}

function entry(e, isHead) {
  const div = el("div", `entry ${e.role}${isHead ? " head" : ""}`);
  div.append(el("div", "role", e.missing ? "entry not stored" : e.role));
  if (e.role === "root") {
    div.append(el("div", "block", e.model));
    const sys = el("details");
    sys.append(el("summary", null, "system prompt and tools"), el("pre", null, json(e.system)), el("pre", null, json(e.tools)));
    div.append(sys);
    return div;
  }
  if (e.content == null) return div;
  let content;
  try { content = JSON.parse(e.content); } catch { content = e.content; }
  if (typeof content === "string") content = [{ type: "text", text: content }];
  for (const b of content) {
    if (b.type === "text") div.append(el("div", "block", b.text));
    else if (b.type === "tool_use") div.append(el("div", "block tool", `→ ${b.name} ${JSON.stringify(b.input)}`));
    else if (b.type === "tool_result") {
      const c = typeof b.content === "string" ? b.content : (b.content || []).map((x) => x.text || "").join("\n");
      div.append(el("div", "block tool", `← ${c}`));
    } else div.append(el("div", "block tool", JSON.stringify(b)));
  }
  return div;
}

const json = (s) => { try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } };
const preview = (s) => { try { const v = JSON.parse(s); return v.question || s; } catch { return s; } };

function addFacts(list) {
  const ul = $("#facts ul");
  for (const f of list) {
    const li = el("li");
    li.append(el("span", "seq", `${f.seq} `), el("span", "at", `${clock(f.at)} `), el("span", f.by, f.text));
    ul.prepend(li);
  }
  while (ul.children.length > 300) ul.lastChild.remove();
}

// The stream's event id is the journal position: the browser resends it on
// reconnect and gets every record after it.
const source = new EventSource("/events");
source.onopen = () => { $("#link").textContent = "live"; $("#link").className = "meta"; };
source.onerror = () => { $("#link").textContent = "reconnecting"; $("#link").className = "meta down"; };
source.onmessage = (m) => {
  const data = JSON.parse(m.data);
  view = data.view;
  addFacts(data.facts);
  render();
};

// Throbbers move and waits grow between events.
let frame = 0;
setInterval(() => {
  frame = (frame + 1) % FRAMES.length;
  for (const s of document.querySelectorAll("[data-spin]")) s.textContent = FRAMES[frame];
}, 100);
setInterval(render, 1000);
</script>
</body>
</html>
