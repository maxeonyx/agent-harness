<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>harness</title>
<script>
// Reports the page's errors to the brain's log (`GET /report`: which tab,
// what it was doing, the error). A classic script, and the first, so it also
// sees a page script that fails to load or throws while loading, which a
// module could not report. It hears whatever is uncaught, and whatever a page
// script hands to `fail` (base.js), which `reportError`s. The console still
// has each one; the brain's log has it too, so nobody has to open the console.
(() => {
  const sent = new Set();
  const origin = `${location.origin}/page/`;
  const clip = (s, n) => s.length > n ? `${s.slice(0, n)}…` : s;
  const text = (x) => x?.doing === undefined ? String(x) : x.message;
  const frames = (x) => String(x?.stack ?? "").split("\n").map((l) => l.trim()).filter((l) => l.startsWith("at "))
    .slice(0, 3).map((l) => l.replaceAll(origin, "")).join(" < ");
  // An error that repeats is reported once.
  const ship = (doing, error) => {
    if (sent.has(`${doing}\n${error}`)) return;
    sent.add(`${doing}\n${error}`);
    let tab = "unknown";
    try { tab = sessionStorage.getItem("replica") ?? tab; } catch { /* no storage: the tab has no id to give */ }
    const query = new URLSearchParams({ tab, doing: clip(doing, 600), error: clip(error, 1000) });
    fetch(`/report?${query}`, { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); })
      .catch((e) => console.warn(`could not report to the brain: ${e}`));
  };
  addEventListener("error", (e) => {
    if (e.target !== window) return ship(`loading ${e.target.src ?? e.target.href}`, "it did not load");
    ship(e.error?.doing ?? `running ${e.filename.replace(origin, "")}:${e.lineno}:${e.colno}`, text(e.error ?? e.message));
  }, true);
  addEventListener("unhandledrejection", (e) => {
    const where = frames(e.reason);
    ship(e.reason?.doing ?? `running ${where.length > 0 ? where : "a promise nobody awaited"}`, text(e.reason));
  });
})();
</script>
