[package]
name = "harness-face-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The harness's web face: the task tree, live from the journal, and Max's compose box with dictation, over HTTPS."

[dependencies]
harness-core = { path = "../core" }
harness-provider = { path = "../provider" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
webpki-roots = "1"

