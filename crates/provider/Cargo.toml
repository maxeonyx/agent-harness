[package]
name = "harness-provider"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The Anthropic Messages API on a Claude subscription login, in terms of harness-core."

[dependencies]
harness-core = { path = "../core" }
serde_json = "1"
harness-runtime = { path = "../runtime" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
