[package]
name = "harness-program"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "A session's program: what its requests render, the harness's tools, and the policy the core leaves open. No I/O; builds for wasm32."

[dependencies]
harness-core = { path = "../core" }
# preserve_order: a tool definition reaches the model in the order it is written.
serde_json = { version = "1", features = ["preserve_order"] }
