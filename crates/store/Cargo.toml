[package]
name = "harness-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "A place's records, the values they name, and its own place id, in one SQLite file."

[dependencies]
harness-core = { path = "../core" }
harness-substrate = { path = "../substrate" }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde_json = "1"
