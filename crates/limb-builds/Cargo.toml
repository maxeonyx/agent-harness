[package]
name = "harness-limb-builds"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The builds tool set: relaunches its brain onto a commit through a rehearsal and a gated opening, and goes back if the new build dies."

[dependencies]
harness-core = { path = "../core" }
harness-limb = { path = "../limb" }
harness-provider = { path = "../provider" }
harness-store = { path = "../store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
