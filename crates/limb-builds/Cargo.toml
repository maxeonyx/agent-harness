[package]
name = "harness-limb-builds"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The builds tool set: relaunches its brain onto a commit, and goes back if the new build fails."

[dependencies]
harness-core = { path = "../core" }
harness-limb = { path = "../limb" }
harness-store = { path = "../store" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
