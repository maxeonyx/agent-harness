[package]
name = "harness-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The agent harness's core model: tasks, contexts, calls and environments, as one schema on the substrate."

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
imbl = "6"
serde = { version = "1", features = ["derive"] }
harness-substrate = { path = "../substrate" }
