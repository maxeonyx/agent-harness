[package]
name = "harness-limb-workspace"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The workspace tool set: a shell and file tools in any directory on the limb's machine; and the user set, Max's own instructions and skills."

[dependencies]
harness-core = { path = "../core" }
harness-limb = { path = "../limb" }
harness-runtime = { path = "../runtime" }
harness-substrate = { path = "../substrate" }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
harness-store = { path = "../store" }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
