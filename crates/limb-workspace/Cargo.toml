[package]
name = "harness-limb-workspace"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The workspace limb: a shell and file tools in one directory, as calls of the harness's core model."

[dependencies]
harness-core = { path = "../core" }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
