[package]
name = "walking-skeleton"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone spike project, deliberately outside the agent-tools workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
    "process",
    "io-std",
    "io-util",
    "fs",
] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
libc = "0.2.189"

[dev-dependencies]
wait-timeout = "0.2"

[[bin]]
name = "skeleton"
path = "src/main.rs"

[[bin]]
name = "fake-provider"
path = "src/bin/fake_provider.rs"
